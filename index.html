<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Inspection Form - ระบบใบตรวจสอบอุปกรณ์ไฟฟ้า MEA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts (Sarabun สำหรับเอกสารทางการ) -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            padding: 15mm;
            margin: 0 auto;
            background: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        @media print {
            body { background: white; }
            .no-print { display: none !important; }
            .a4-page { box-shadow: none; padding: 0; width: 100%; }
        }
        /* Custom Scrollbar for Horizontal Navigation */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased" x-data="inspectionApp()">

    <!-- TOP HEADER BAR -->
    <header class="no-print sticky top-0 z-50 bg-slate-900 text-white shadow-lg border-b border-slate-800 px-6 py-4 flex flex-wrap justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-xl font-bold shadow-md">⚡</div>
            <div>
                <h1 class="text-lg font-bold tracking-wide text-white">Digital Inspection System</h1>
                <p class="text-xs text-slate-400">ระบบใบตรวจสอบบำรุงรักษาอุปกรณ์ไฟฟ้า (MEA Standard)</p>
            </div>
        </div>
        <div class="flex items-center space-x-3 text-sm mt-2 sm:mt-0">
            <span class="text-xs bg-slate-800 text-emerald-400 px-3 py-1.5 rounded-full border border-slate-700 flex items-center gap-1.5 font-medium" x-text="autoSaveStatus"></span>
            <template x-if="activeFormCode">
                <button @click="exportPDF()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl transition font-medium text-xs shadow-sm flex items-center gap-1">
                    ⬇ Export PDF A4
                </button>
            </template>
        </div>
    </header>

    <!-- HORIZONTAL SELECTION BAR (แถบเลือกใบงานแนวยาวด้านบน) -->
    <nav class="no-print bg-white border-b border-slate-200 shadow-sm px-6 py-3 sticky top-[73px] z-40">
        <div class="max-w-7xl mx-auto flex items-center space-x-3 overflow-x-auto no-scrollbar py-1">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider whitespace-nowrap mr-2">เลือกใบตรวจสอบ:</span>
            <template x-for="form in formsList" :key="form.code">
                <button @click="selectForm(form.code)" 
                    :class="activeFormCode === form.code ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20 border-blue-600' : 'bg-slate-100 hover:bg-slate-200 text-slate-700 border-slate-200'"
                    class="px-4 py-2 rounded-xl text-xs font-medium whitespace-nowrap transition border flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full" :class="activeFormCode === form.code ? 'bg-white' : 'bg-blue-500'"></span>
                    <span x-text="form.code + ' : ' + form.name"></span>
                </button>
            </template>
        </div>
    </nav>

    <!-- MAIN CONTAINER (แสดงข้อมูลด้านล่างเมื่อกดเลือก) -->
    <main class="py-8 px-4 max-w-7xl mx-auto">

        <!-- Initial State: เมื่อยังไม่ได้เลือกใบงาน -->
        <template x-if="!activeFormCode">
            <div class="text-center py-20 space-y-4 bg-white rounded-2xl border border-slate-200 shadow-sm max-w-3xl mx-auto p-8">
                <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-inner">📄</div>
                <h2 class="text-2xl font-bold text-slate-900">กรุณาเลือกประเภทใบตรวจสอบจากแถบด้านบน</h2>
                <p class="text-sm text-slate-500 max-w-md mx-auto">เลือกหัวข้อใบงานที่ต้องการเพื่อแสดงแบบฟอร์มบันทึกข้อมูลภาคสนามรูปแบบดิจิทัล A4 ที่พร้อมใช้งานทันที</p>
            </div>
        </template>

        <!-- Form Display State: แสดงแบบฟอร์ม A4 ด้านล่าง -->
        <template x-if="activeFormCode">
            <div class="space-y-6">
                
                <!-- Progress & Action Bar -->
                <div class="max-w-[210mm] mx-auto bg-white p-4 rounded-2xl shadow-sm border border-slate-200 no-print flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div class="w-full sm:w-1/2">
                        <div class="flex justify-between text-xs font-semibold mb-1 text-slate-600">
                            <span x-text="'ความคืบหน้าการตรวจสอบ: ' + checkedCount + ' / ' + totalItems + ' รายการ'"></span>
                            <span x-text="progressPercentage + '%'" class="text-blue-600 font-bold"></span>
                        </div>
                        <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-200">
                            <div class="bg-blue-600 h-full rounded-full transition-all duration-300" :style="'width: ' + progressPercentage + '%'"></div>
                        </div>
                    </div>
                    <div>
                        <button @click="validateAndSubmit()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-xl font-medium text-xs transition shadow-sm shadow-emerald-600/20 flex items-center gap-2">
                            ✓ ส่งใบตรวจสอบสมบูรณ์
                        </button>
                    </div>
                </div>

                <!-- A4 Document Layout -->
                <div class="a4-page rounded-2xl border border-slate-200 text-slate-900 text-sm space-y-6">
                    
                    <!-- Document Header -->
                    <div class="border-b border-slate-200 pb-4 flex justify-between items-start">
                        <div>
                            <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg border border-blue-100" x-text="activeFormCode"></span>
                            <h2 class="text-xl font-bold text-slate-900 mt-2" x-text="activeFormTitle"></h2>
                            <p class="text-xs text-slate-400 mt-0.5">การไฟฟ้านครหลวง (MEA) • ระบบสารสนเทศงานบำรุงรักษาอุปกรณ์ไฟฟ้า</p>
                        </div>
                        <div class="text-right">
                            <div class="text-xs text-slate-500 font-medium">วันที่บันทึก: <span class="text-slate-900 font-semibold" x-text="currentDate"></span></div>
                        </div>
                    </div>

                    <!-- Section 1: Dynamic General Info (ข้อมูลทั่วไปเฉพาะของแต่ละใบ) -->
                    <div class="space-y-3">
                        <h3 class="font-bold text-xs uppercase tracking-wider text-slate-500 bg-slate-50 px-3 py-2 rounded-xl border-l-4 border-blue-600">1. ข้อมูลทั่วไป</h3>
                        
                        <!-- Form 015: หม้อแปลงจำหน่าย[cite: 1] -->
                        <template x-if="activeFormCode === 'SF-07-0-015'">
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                                <div><label class="block font-medium text-slate-500 mb-1">Station ID</label><input type="text" x-model="formData.station_id" class="w-full border border-slate-200 rounded-xl p-2 outline-none focus:border-blue-500 bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">สถานที่</label><input type="text" x-model="formData.location" class="w-full border border-slate-200 rounded-xl p-2 outline-none focus:border-blue-500 bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">GIS Lat.</label><input type="text" x-model="formData.latitude" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50" readonly></div>
                                <div><label class="block font-medium text-slate-500 mb-1">GIS Long.</label><div class="flex gap-1"><input type="text" x-model="formData.longitude" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50" readonly><button @click="getGPS()" class="bg-blue-600 text-white px-2.5 rounded-xl hover:bg-blue-500 transition">📍</button></div></div>
                                <div><label class="block font-medium text-slate-500 mb-1">MEA No.1</label><input type="text" x-model="formData.mea_no1" class="w-full border border-slate-200 rounded-xl p-2 outline-none focus:border-blue-500 bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">MEA No.2</label><input type="text" x-model="formData.mea_no2" class="w-full border border-slate-200 rounded-xl p-2 outline-none focus:border-blue-500 bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">MEA No.3</label><input type="text" x-model="formData.mea_no3" class="w-full border border-slate-200 rounded-xl p-2 outline-none focus:border-blue-500 bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">จำนวนเฟส</label><input type="text" x-model="formData.phases" class="w-full border border-slate-200 rounded-xl p-2 outline-none focus:border-blue-500 bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">ยี่ห้อ (TR)</label><input type="text" x-model="formData.brand" class="w-full border border-slate-200 rounded-xl p-2 outline-none focus:border-blue-500 bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">ขนาด</label><input type="text" x-model="formData.capacity" class="w-full border border-slate-200 rounded-xl p-2 outline-none focus:border-blue-500 bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">ชนิด</label><input type="text" x-model="formData.type" class="w-full border border-slate-200 rounded-xl p-2 outline-none focus:border-blue-500 bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">ลักษณะการติดตั้ง</label><input type="text" x-model="formData.install_style" class="w-full border border-slate-200 rounded-xl p-2 outline-none focus:border-blue-500 bg-slate-50/50"></div>
                            </div>
                        </template>

                        <!-- Form 016: Load Break Switch[cite: 2] -->
                        <template x-if="activeFormCode === 'SF-07-0-016'">
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                                <div><label class="block font-medium text-slate-500 mb-1">Station ID</label><input type="text" x-model="formData.station_id" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">สถานที่</label><input type="text" x-model="formData.location" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">GIS Lat.</label><input type="text" x-model="formData.latitude" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50" readonly></div>
                                <div><label class="block font-medium text-slate-500 mb-1">GIS Long.</label><div class="flex gap-1"><input type="text" x-model="formData.longitude" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50" readonly><button @click="getGPS()" class="bg-blue-600 text-white px-2.5 rounded-xl">📍</button></div></div>
                                <div><label class="block font-medium text-slate-500 mb-1">ยี่ห้อ LBS</label><input type="text" x-model="formData.lbs_brand" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">LBS MEA No.</label><input type="text" x-model="formData.lbs_mea" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">Switch No.</label><input type="text" x-model="formData.switch_no" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">ยี่ห้อ VT</label><input type="text" x-model="formData.vt_brand" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">VT MEA No.</label><input type="text" x-model="formData.vt_mea" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">ตู้ OFDF No.</label><input type="text" x-model="formData.ofdf_no" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                            </div>
                        </template>

                        <!-- Form 017: Sectionalizer[cite: 3] -->
                        <template x-if="activeFormCode === 'SF-07-0-017'">
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                                <div><label class="block font-medium text-slate-500 mb-1">Station ID</label><input type="text" x-model="formData.station_id" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">สถานที่</label><input type="text" x-model="formData.location" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">GIS Lat.</label><input type="text" x-model="formData.latitude" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50" readonly></div>
                                <div><label class="block font-medium text-slate-500 mb-1">GIS Long.</label><div class="flex gap-1"><input type="text" x-model="formData.longitude" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50" readonly><button @click="getGPS()" class="bg-blue-600 text-white px-2.5 rounded-xl">📍</button></div></div>
                                <div><label class="block font-medium text-slate-500 mb-1">ยี่ห้อ SZ</label><input type="text" x-model="formData.sz_brand" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">SZ MEA No.</label><input type="text" x-model="formData.sz_mea" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">Switch No.</label><input type="text" x-model="formData.switch_no" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                            </div>
                        </template>

                        <!-- Form 018: Ring Main Unit (RMU)[cite: 4] -->
                        <template x-if="activeFormCode === 'SF-07-0-018'">
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                                <div><label class="block font-medium text-slate-500 mb-1">Station ID</label><input type="text" x-model="formData.station_id" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">สถานที่</label><input type="text" x-model="formData.location" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">GIS Lat.</label><input type="text" x-model="formData.latitude" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50" readonly></div>
                                <div><label class="block font-medium text-slate-500 mb-1">GIS Long.</label><div class="flex gap-1"><input type="text" x-model="formData.longitude" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50" readonly><button @click="getGPS()" class="bg-blue-600 text-white px-2.5 rounded-xl">📍</button></div></div>
                                <div><label class="block font-medium text-slate-500 mb-1">ยี่ห้อ RMU</label><input type="text" x-model="formData.rmu_brand" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">RMU MEA No.</label><input type="text" x-model="formData.rmu_mea" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                            </div>
                        </template>

                        <!-- Form 019: UNITSUBSTATION[cite: 5] -->
                        <template x-if="activeFormCode === 'SF-07-0-019'">
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                                <div><label class="block font-medium text-slate-500 mb-1">Station ID</label><input type="text" x-model="formData.station_id" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">สถานที่</label><input type="text" x-model="formData.location" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">GIS Lat.</label><input type="text" x-model="formData.latitude" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50" readonly></div>
                                <div><label class="block font-medium text-slate-500 mb-1">GIS Long.</label><div class="flex gap-1"><input type="text" x-model="formData.longitude" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50" readonly><button @click="getGPS()" class="bg-blue-600 text-white px-2.5 rounded-xl">📍</button></div></div>
                                <div><label class="block font-medium text-slate-500 mb-1">ยี่ห้อ TR</label><input type="text" x-model="formData.tr_brand" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">TR MEA No.</label><input type="text" x-model="formData.tr_mea" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">ยี่ห้อ RMU</label><input type="text" x-model="formData.rmu_brand" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">RMU MEA No.</label><input type="text" x-model="formData.rmu_mea" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                            </div>
                        </template>

                        <!-- Form 020: Capacitor Bank[cite: 6] -->
                        <template x-if="activeFormCode === 'SF-07-0-020'">
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                                <div><label class="block font-medium text-slate-500 mb-1">Station ID</label><input type="text" x-model="formData.station_id" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">สถานที่</label><input type="text" x-model="formData.location" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">GIS Lat.</label><input type="text" x-model="formData.latitude" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50" readonly></div>
                                <div><label class="block font-medium text-slate-500 mb-1">GIS Long.</label><div class="flex gap-1"><input type="text" x-model="formData.longitude" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50" readonly><button @click="getGPS()" class="bg-blue-600 text-white px-2.5 rounded-xl">📍</button></div></div>
                                <div><label class="block font-medium text-slate-500 mb-1">MEA No.</label><input type="text" x-model="formData.mea_no" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">สายป้อน</label><input type="text" x-model="formData.feeder" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">ชนิด Control</label><input type="text" x-model="formData.ctrl_type" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">ยี่ห้อ (Control)</label><input type="text" x-model="formData.ctrl_brand" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">ชนิด Switch</label><input type="text" x-model="formData.switch_type" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">ยี่ห้อ (Switch)</label><input type="text" x-model="formData.switch_brand" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                            </div>
                        </template>

                        <!-- Form 021 & 022: Mesh Network Transformer[cite: 7, 8] -->
                        <template x-if="activeFormCode === 'SF-07-0-021' || activeFormCode === 'SF-07-0-022'">
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                                <div><label class="block font-medium text-slate-500 mb-1">STATION / สถานที่</label><input type="text" x-model="formData.station" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>

                selectForm(code) {
                    const found = this.formsList.find(f => f.code === code);
                    this.activeFormCode = found.code;
                    this.activeFormTitle = found.name;
                    this.currentChecklistItems = JSON.parse(JSON.stringify(this.checklistDatabase[code] || []));
                    window.scrollTo({ top: 120, behavior: 'smooth' });
                },

                get checkedCount() {
                    return this.currentChecklistItems.filter(i => i.result !== '').length;
                },

                get totalItems() {
                    return this.currentChecklistItems.length;
                },

                get progressPercentage() {
                    if (this.totalItems === 0) return 0;
                    return Math.round((this.checkedCount / this.totalItems) * 100);
                },

                getGPS() {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(position => {
                            this.formData.latitude = position.coords.latitude.toFixed(6);
                            this.formData.longitude = position.coords.longitude.toFixed(6);
                            this.autoSaveStatus = '✓ ดึงพิกัด GPS สำเร็จ';
                        }, error => {
                            alert('ไม่สามารถดึงตำแหน่งพิกัดได้ กรุณาเปิดใช้งาน Location GPS');
                        });
                    } else {
                        alert('Browser ของคุณไม่รองรับการระบุตำแหน่งพิกัด');
                    }
                },

                validateAndSubmit() {
                    if (this.checkedCount < this.totalItems) {
                        alert('⚠ กรุณาตรวจสอบและเลือกผลการตรวจสอบให้ครบทุกรายการ');
                        return;
                    }
                    alert('✓ ส่งใบตรวจสอบเรียบร้อยแล้ว ระบบบันทึกข้อมูลเข้าฐานข้อมูลสำเร็จ');
                },

                exportPDF() {
                    window.print();
                }
            }
