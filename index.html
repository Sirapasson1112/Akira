<!DOCTYPE html>
<html lang="th">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
        .app-container { width: 210mm; margin: 0 auto; box-sizing: border-box; }
        .a4-sheet {
            width: 210mm;
            min-height: 297mm;
            padding: 12mm 15mm;
            background: #ffffff;
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
            border-radius: 12px;
            position: relative;
            box-sizing: border-box;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #1e293b; padding: 3px 6px; font-size: 11px; }
        input[type="text"], input[type="date"] { border: none; outline: none; background: transparent; width: 100%; font-family: 'Sarabun', sans-serif; font-size: 11px; }
        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            .a4-sheet { box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 10mm !important; border-radius: 0 !important; border: none !important; }
        }
    </style>
</head>
<body class="pb-16 text-slate-700">

    <!-- Header -->
    <header class="no-print bg-white/80 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-50">
        <div class="app-container px-4 py-3 flex flex-wrap justify-between items-center gap-3">

                    <p class="text-[10px] text-slate-400">Digital Inspection Workspace</p>
                </div>
            </div>
            <button onclick="handleGoogleLogin()" id="loginBtn" class="flex items-center gap-2 px-3.5 py-2 border border-slate-200 rounded-xl text-xs font-medium hover:bg-slate-50 transition bg-white text-slate-600 cursor-pointer shadow-2xs">
                <span id="loginText">Google Account</span>
            </button>
        </div>
    </header>

    <main class="no-print app-container px-4 mt-6 text-xs space-y-4">
        <!-- Action Toolbar -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
                <span id="statusBadge" class="inline-flex items-center gap-1.5 px-3 py-1 bg-emerald-50 text-emerald-700 rounded-lg text-xs font-medium border border-emerald-100">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> พร้อมทำงาน
                </span>
                <button onclick="saveNewRecord()" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium transition cursor-pointer shadow-sm">บันทึกรายการใหม่</button>
                <button onclick="saveCurrentRecord()" class="px-3.5 py-2 bg-slate-50 hover:bg-slate-100 text-slate-600 rounded-xl font-medium transition cursor-pointer border border-slate-200">บันทึกปัจจุบัน</button>
                <button onclick="copyNewDraft()" class="px-3.5 py-2 bg-slate-50 hover:bg-slate-100 text-slate-600 rounded-xl font-medium transition cursor-pointer border border-slate-200">คัดลอกฉบับใหม่</button>
                <button onclick="createNewForm()" class="px-3.5 py-2 hover:bg-slate-50 text-slate-500 rounded-xl font-medium transition cursor-pointer">ฟอร์มใหม่</button>
                <button onclick="clearFormInputs()" class="px-3.5 py-2 hover:bg-slate-50 text-slate-500 rounded-xl font-medium transition cursor-pointer">ล้าง</button>
            </div>
            <div class="flex items-center gap-2">

                <button onclick="exportCSV()" class="px-4 py-2 bg-white border border-slate-200 text-slate-700 rounded-xl font-medium hover:bg-slate-50 transition cursor-pointer">📥 CSV</button>
            </div>
        </div>

        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs">
            <div class="text-slate-800 font-bold mb-3 text-xs">📑 เลือกแบบฟอร์มใบงานตรวจสอบอุปกรณ์ไฟฟ้า (11 แบบฟอร์ม)</div>
            <div id="pillsContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2"></div>
        </div>
    </main>
