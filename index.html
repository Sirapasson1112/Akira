<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบำรุงรักษาอุปกรณ์ไฟฟ้า - MediumBlue Theme</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #F4F6FB; color: #1E293B; margin: 0; padding: 0; }
        .app-container { width: 210mm; max-width: 100%; margin: 0 auto; box-sizing: border-box; }
        .a4-sheet {
            width: 210mm;
            min-height: 297mm;
            padding: 12mm 15mm;
            background: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 128, 0.08), 0 5px 10px -5px rgba(0, 0, 128, 0.04);
            border-radius: 8px;
            position: relative;
            box-sizing: border-box;
            border: 1px solid #0000CD;
            margin: 0 auto;
        }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #0000CD; padding: 3px 6px; font-size: 10px; color: #1E293B; }
        th { background-color: #E6E6FA; font-weight: 600; }
        input[type="text"], input[type="date"] { border: none; outline: none; background: transparent; width: 100%; font-family: 'Sarabun', sans-serif; font-size: 10px; color: #0F172A; }
        textarea { color: #0F172A; }
        
        /* MediumBlue Theme Accents (#0000CD) */
        .theme-accent { background-color: #0000CD; color: #FFFFFF; }
        .theme-accent-hover:hover { background-color: #00008B; }
        .theme-border { border-color: #0000CD; }
        .theme-text-accent { color: #0000CD; }
        .accent-radio { accent-color: #0000CD; }

        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            .a4-sheet { box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 8mm !important; border-radius: 0 !important; border: none !important; }
            input[type="text"], input[type="date"] { border: none !important; }
        }
    </style>
</head>
<body class="pb-16">

    <!-- Header -->
    <header class="no-print bg-white border-b border-theme-border sticky top-0 z-50 shadow-xs">
        <div class="app-container px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-[#E6E6FA] border border-[#0000CD] flex items-center justify-center text-[#0000CD] p-2 shadow-2xs shrink-0 font-bold">
                    ⚡

                <div>
                    <h1 class="text-xs font-bold text-[#0000CD]">ระบบบำรุงรักษาอุปกรณ์ไฟฟ้า</h1>
                    <p class="text-[10px] theme-text-accent">Digital Inspection & Maintenance Workspace (MediumBlue Theme)</p>
                </div>
            </div>
            <button onclick="handleGoogleLogin()" class="flex items-center gap-2 px-3.5 py-2 border border-theme-border rounded-md text-xs font-medium hover:bg-[#E6E6FA] transition bg-white text-[#0000CD] cursor-pointer shadow-2xs">
                👤 เข้าสู่ระบบ Google
            </button>
        </div>
    </header>

    <main class="no-print app-container px-4 mt-6 text-xs space-y-4">
        <!-- Tab Navigation -->
        <div class="grid grid-cols-2 gap-2 bg-[#E6E6FA] p-1 rounded-xl border border-theme-border">
            <button class="py-2.5 bg-white text-[#0000CD] font-bold rounded-lg shadow-xs flex items-center justify-center gap-2 cursor-pointer">
                📋 แบบฟอร์มตรวจสอบหน้างาน (Inspection Forms)
            </button>
            <a href="planning.html" class="py-2.5 text-[#475569] hover:text-[#0000CD] font-medium rounded-lg flex items-center justify-center gap-2 transition">
                📊 แผนงาน PM & KPIs (PM Planning & Cost)
            </a>
        </div>

        <!-- Action Toolbar -->
        <div class="bg-white p-3 rounded-xl border border-theme-border shadow-xs flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
                <button onclick="saveNewRecord()" class="px-3 py-2 bg-[#0000CD] hover:bg-[#00008B] text-white rounded-lg font-medium transition cursor-pointer shadow-xs">💾 บันทึกใหม่</button>
                <button onclick="saveCurrentRecord()" class="px-3 py-2 bg-[#E6E6FA] hover:bg-[#D8BFD8] text-[#0000CD] rounded-lg font-medium transition cursor-pointer">📝 บันทึกทับ</button>
                <button onclick="copyNewDraft()" class="px-3 py-2 bg-[#E6E6FA] hover:bg-[#D8BFD8] text-[#0000CD] rounded-lg font-medium transition cursor-pointer">📄 คัดลอก</button>
                <button onclick="createNewForm()" class="px-3 py-2 bg-[#E6E6FA] hover:bg-[#D8BFD8] text-[#0000CD] rounded-lg font-medium transition cursor-pointer">➕ ฟอร์มใหม่</button>
                <button onclick="clearFormInputs()" class="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-lg font-medium transition cursor-pointer">🗑️ ล้าง</button>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="exportExcel()" class="px-3 py-2 bg-[#1E3A8A] hover:bg-[#1E40AF] text-white rounded-lg font-medium transition cursor-pointer shadow-xs">🟩 ส่งออก Excel</button>
                <button onclick="window.print()" class="px-3 py-2 bg-[#0000CD] hover:bg-[#00008B] text-white rounded-lg font-medium transition cursor-pointer shadow-xs">🖨️ พิมพ์/PDF</button>
            </div>
        </div>

        <!-- Form Selection Grid -->
        <div class="bg-white p-4 rounded-xl border border-theme-border shadow-xs">
            <div class="text-[#1E293B] font-bold mb-3 text-xs flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-[#0000CD]"></span> เลือกแบบฟอร์มใบงานตรวจสอบอุปกรณ์ไฟฟ้า (ครบถ้วนทั้ง 11 แบบฟอร์ม)
            </div>
            <div id="pillsContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2"></div>
        </div>
    </main>

    <!-- A4 Document Workspace -->

        <div id="zoomContainer" class="transition-transform duration-200 origin-top">
            <div id="a4Paper" class="a4-sheet text-[#1E293B]"></div>
        </div>
    </div>

        const pillsContainer = document.getElementById('pillsContainer');
        const a4Paper = document.getElementById('a4Paper');

        function loadForm(key) {
            currentFormKey = key;
            const form = formsData[key] || formsData["015"];
            a4Paper.innerHTML = form.render();

            document.querySelectorAll('.form-pill').forEach(btn => {
                if(btn.dataset.key === key) {
                    btn.className = "form-pill px-3.5 py-2.5 theme-accent text-white rounded-md font-semibold text-xs whitespace-nowrap shadow-xs cursor-pointer transition-all";
                } else {
                    btn.className = "form-pill px-3.5 py-2.5 bg-white border border-theme-border text-[#1E293B] rounded-md font-medium text-xs whitespace-nowrap hover:bg-[#E6E6FA] cursor-pointer transition-all";
                }
            });
        }

        Object.keys(formsData).forEach(key => {
            const btn = document.createElement('button');
            btn.dataset.key = key;
            btn.className = "form-pill";
            btn.innerText = formsData[key].code;
            btn.onclick = () => loadForm(key);
            pillsContainer.appendChild(btn);
        });

        function getGPSLocation(latId, longId) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(6);
                        const lon = position.coords.longitude.toFixed(6);
                        document.getElementById(latId).value = lat;
                        document.getElementById(longId).value = lon;
                        alert("📍 ดึงพิกัด GPS สำเร็จ: " + lat + ", " + lon);
                    },
                    (error) => {
                        alert("⚠️ ไม่สามารถดึงพิกัดได้: กรุณาอนุญาตการเข้าถึงตำแหน่ง (GPS)");
                    }
                );
            } else {
                alert("❌ เบราว์เซอร์ของคุณไม่รองรับการระบุตำแหน่ง GPS");
            }
        }

        function saveNewRecord() { alert("💾 บันทึกรายการตรวจสอบใหม่ลงในระบบสำเร็จ!"); }
