<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Inspection Form - ระบบใบตรวจสอบอุปกรณ์ไฟฟ้า MEA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts (Sarabun) -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            padding: 15mm;
            margin: 0 auto;
            background: white;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
        }
        @media print {
            body { background: white; }
            .no-print { display: none !important; }
            .a4-page { box-shadow: none; padding: 0; width: 100%; }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased" x-data="inspectionApp()">

    <!-- HEADER / SUPER FAST NAVIGATION BAR -->
    <header class="no-print sticky top-0 z-50 bg-slate-900 text-white shadow-lg px-6 py-3.5 flex flex-wrap justify-between items-center border-b border-slate-800">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-xl font-bold shadow">⚡</div>
            <div>
                <h1 class="text-base font-bold tracking-wide text-white">Digital Inspection (Easy Mode)</h1>
                <p class="text-xs text-slate-400">ระบบใบตรวจสอบไฟฟ้า กฟน. ใช้งานง่าย บันทึกออโต้</p>
            </div>
        </div>
        <div class="flex items-center space-x-3 text-sm mt-2 sm:mt-0">
            <span class="text-xs bg-slate-800 text-emerald-400 px-3 py-1.5 rounded-full border border-slate-700 font-medium" x-text="autoSaveStatus"></span>
            <template x-if="activeFormCode">
                <button @click="exportPDF()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl transition font-medium text-xs shadow flex items-center gap-1.5">
                    🖨️ พิมพ์ / Export PDF
                </button>
            </template>
        </div>
    </header>

    <!-- HORIZONTAL SCROLLABLE FORM SELECTOR -->
    <nav class="no-print bg-white border-b border-slate-200 shadow-sm px-6 py-3 sticky top-[69px] z-40">
        <div class="max-w-7xl mx-auto flex items-center space-x-2 overflow-x-auto no-scrollbar py-1">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider whitespace-nowrap mr-2">เลือกใบงาน:</span>
            <template x-for="form in formsList" :key="form.code">
                <button @click="selectForm(form.code)" 
                    :class="activeFormCode === form.code ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20 border-blue-600 scale-105' : 'bg-slate-100 hover:bg-slate-200 text-slate-700 border-slate-200'"
                    class="px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all duration-200 border flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full" :class="activeFormCode === form.code ? 'bg-white' : 'bg-blue-500'"></span>
                    <span x-text="form.code + ' : ' + form.name"></span>
                </button>
            </template>
        </div>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <main class="py-6 px-4 max-w-7xl mx-auto">

        <!-- Welcome State -->
        <template x-if="!activeFormCode">
            <div class="text-center py-24 space-y-4 bg-white rounded-3xl border border-slate-200 shadow-sm max-w-2xl mx-auto p-10">
                <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-3xl flex items-center justify-center text-4xl mx-auto shadow-inner">⚡</div>
                <h2 class="text-2xl font-bold text-slate-900">เลือกประเภทใบตรวจสอบจากด้านบนได้เลยครับ</h2>
                <p class="text-sm text-slate-500 max-w-md mx-auto">ระบบถูกออกแบบให้ใช้งานง่าย กรอกสะดวก มีปุ่มลัดติ๊กปกติทั้งหมด และบันทึกข้อมูลให้อัตโนมัติทันทีที่คุณพิมพ์</p>
            </div>
        </template>

        <!-- Active Form Layout -->
        <template x-if="activeFormCode">
            <div class="space-y-6">
                
                <!-- Quick Control Toolbar (ตัวช่วยให้ทำงานเร็วขึ้น) -->
                <div class="max-w-[210mm] mx-auto bg-white p-4 rounded-2xl shadow-sm border border-slate-200 no-print flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div class="flex items-center gap-3 w-full sm:w-auto">
                        <button @click="markAllNormal()" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                            ✅ ติ๊ก "ปกติ" ทั้งหมดด่วน
                        </button>
                        <button @click="resetForm()" class="bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 px-3.5 py-2 rounded-xl text-xs font-semibold transition">
                            🔄 ล้างข้อมูลใหม่
                        </button>
                    </div>
                    <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end">
                        <div class="text-xs font-semibold text-slate-600">
                            ตรวจแล้ว: <span class="text-blue-600 font-bold" x-text="checkedCount"></span> / <span x-text="totalItems"></span> ข้อ (<span x-text="progressPercentage"></span>%)
                        </div>
                        <button @click="validateAndSubmit()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl font-bold text-xs transition shadow-md shadow-blue-600/20">
                            ✓ ส่งใบตรวจสอบ
                        </button>
                    </div>
                </div>

                <!-- A4 Form Sheet -->
                <div class="a4-page rounded-2xl border border-slate-200 text-slate-900 text-sm space-y-6">
                    
                    <!-- Header -->
                    <div class="border-b border-slate-200 pb-4 flex justify-between items-start">
                        <div>
                            <span class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-lg border border-blue-100" x-text="activeFormCode"></span>
                            <h2 class="text-xl font-bold text-slate-900 mt-2" x-text="activeFormTitle"></h2>
                            <p class="text-xs text-slate-400 mt-0.5">การไฟฟ้านครหลวง (MEA) • ระบบบันทึกข้อมูลภาคสนามดิจิทัล</p>
                        </div>
                        <div class="text-right text-xs text-slate-500 font-medium">
                            วันที่: <span class="text-slate-900 font-semibold" x-text="currentDate"></span>
                        </div>
                    </div>

                    <!-- Section 1: General Info -->
                    <div class="space-y-3">
                        <h3 class="font-bold text-xs uppercase tracking-wider text-slate-500 bg-slate-50 px-3 py-2 rounded-xl border-l-4 border-blue-600">1. ข้อมูลทั่วไป (กรอกเฉพาะข้อมูลที่จำเป็น)</h3>
                        
                        <!-- Dynamic Inputs based on Form -->
                        <template x-if="activeFormCode === 'SF-07-0-015'">
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                                <div><label class="block font-medium text-slate-500 mb-1">Station ID</label><input type="text" x-model="formData.station_id" @input="saveToStorage()" class="w-full border border-slate-200 rounded-xl p-2 outline-none focus:border-blue-500 bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">สถานที่</label><input type="text" x-model="formData.location" @input="saveToStorage()" class="w-full border border-slate-200 rounded-xl p-2 outline-none focus:border-blue-500 bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">GIS Lat.</label><input type="text" x-model="formData.latitude" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50" readonly></div>
                                <div><label class="block font-medium text-slate-500 mb-1">GIS Long.</label><div class="flex gap-1"><input type="text" x-model="formData.longitude" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50" readonly><button @click="getGPS()" class="bg-blue-600 text-white px-2.5 rounded-xl hover:bg-blue-500 transition">📍 ดึงพิกัด</button></div></div>
                                <div><label class="block font-medium text-slate-500 mb-1">MEA No.1</label><input type="text" x-model="formData.mea_no1" @input="saveToStorage()" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">ขนาด (kVA)</label><input type="text" x-model="formData.capacity" @input="saveToStorage()" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">ยี่ห้อหม้อแปลง</label><input type="text" x-model="formData.brand" @input="saveToStorage()" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">ลักษณะติดตั้ง</label><input type="text" x-model="formData.install_style" @input="saveToStorage()" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50/50"></div>
                            </div>
                        </template>

                        <!-- Standard General Info for other forms -->
                        <template x-if="activeFormCode !== 'SF-07-0-015'">
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                                <div><label class="block font-medium text-slate-500 mb-1">Station ID / FIX ID</label><input type="text" x-model="formData.station_id" @input="saveToStorage()" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">สถานที่ติดตั้ง</label><input type="text" x-model="formData.location" @input="saveToStorage()" class="w-full border border-slate-200 rounded-xl p-2 outline-none bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">GIS Lat.</label><input type="text" x-model="formData.latitude" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50" readonly></div>
                                <div><label class="block font-medium text-slate-500 mb-1">GIS Long.</label><div class="flex gap-1"><input type="text" x-model="formData.longitude" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50" readonly><button @click="getGPS()" class="bg-blue-600 text-white px-2.5 rounded-xl">📍 ดึงพิกัด</button></div></div>
                                <div><label class="block font-medium text-slate-500 mb-1">MEA No. / Equipment No.</label><input type="text" x-model="formData.mea_no" @input="saveToStorage()" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50/50"></div>
                                <div><label class="block font-medium text-slate-500 mb-1">ยี่ห้ออุปกรณ์ (Brand)</label><input type="text" x-model="formData.brand" @input="saveToStorage()" class="w-full border border-slate-200 rounded-xl p-2 bg-slate-50/50"></div>
                            </div>
                        </template>
                    </div>

                    <!-- Section 2: Checklist Table -->
                    <div class="space-y-3">
                        <div class="flex justify-between items-center bg-slate-50 px-3 py-2 rounded-xl border-l-4 border-blue-600">
                            <h3 class="font-bold text-xs uppercase tracking-wider text-slate-500">2. รายการตรวจสอบบำรุงรักษา</h3>
                            <span class="text-[11px] text-blue-600 font-semibold">💡 คลิกเลือกสถานะได้ทันทีทุกข้อ</span>
                        </div>
                        <div class="overflow-x-auto border border-slate-200 rounded-2xl shadow-sm">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-slate-50/80 border-b border-slate-200 text-slate-600">
                                        <th class="p-3 w-16 text-center font-semibold">ลำดับ</th>
                                        <th class="p-3 font-semibold">รายการตรวจสอบ</th>
                                        <th class="p-3 w-20 text-center font-semibold text-emerald-600">ปกติ</th>
                                        <th class="p-3 w-20 text-center font-semibold text-rose-600">ชำรุด</th>
                                        <th class="p-3 w-20 text-center font-semibold text-slate-500">ไม่มี</th>
                                        <th class="p-3 w-56 font-semibold">ข้อบกพร่อง / การดำเนินการ</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    <template x-for="(item, index) in currentChecklistItems" :key="item.id">
                                        <tr class="hover:bg-blue-50/30 transition">
                                            <td class="p-3 text-center font-bold text-slate-500" x-text="item.no"></td>
                                            <td class="p-3 font-medium text-slate-800" x-text="item.name"></td>
                                            <td class="p-3 text-center">
                                                <input type="radio" :name="'item_' + item.id" value="normal" x-model="item.result" @change="saveToStorage()" class="w-4 h-4 text-emerald-600 cursor-pointer accent-emerald-600">
                                            </td>
                                            <td class="p-3 text-center">
                                                <input type="radio" :name="'item_' + item.id" value="damaged" x-model="item.result" @change="saveToStorage()" class="w-4 h-4 text-rose-600 cursor-pointer accent-rose-600">
                                            </td>
                                            <td class="p-3 text-center">
                                                <input type="radio" :name="'item_' + item.id" value="none" x-model="item.result" @change="saveToStorage()" class="w-4 h-4 text-slate-400 cursor-pointer accent-slate-500">
                                            </td>
                                            <td class="p-3">
                                                <input type="text" x-model="item.defect" @input="saveToStorage()" placeholder="ระบุข้อบกพร่อง (ถ้ามี)" class="w-full border border-slate-200 rounded-xl p-2 text-xs outline-none focus:border-blue-500 bg-slate-50/30">
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Section 3 & 4: Remarks & Rectification -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <h3 class="font-bold text-xs uppercase tracking-wider text-slate-500 bg-slate-50 px-3 py-2 rounded-xl border-l-4 border-blue-600">3. ข้อเสนอแนะ / ข้อมูลเพิ่มเติม</h3>
                            <textarea x-model="formData.remarks" @input="saveToStorage()" rows="3" class="w-full border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 bg-slate-50/30" placeholder="ระบุรายละเอียดเพิ่มเติม..."></textarea>
                        </div>
                        <div class="space-y-2">
                            <h3 class="font-bold text-xs uppercase tracking-wider text-slate-500 bg-slate-50 px-3 py-2 rounded-xl border-l-4 border-blue-600">4. การปรับปรุงข้อบกพร่อง</h3>
                            <textarea x-model="formData.rectification" @input="saveToStorage()" rows="3" class="w-full border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 bg-slate-50/30" placeholder="ระบุการดำเนินการแก้ไข..."></textarea>
                        </div>
                    </div>

                    <!-- Section 5: Signatures -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-slate-200 text-xs">
                        <div class="space-y-2 text-center border border-slate-200 p-4 rounded-2xl bg-slate-50/50 shadow-sm">
                            <p class="font-bold text-slate-700">ผู้ตรวจ (Inspector)</p>
                            <div class="h-12 border-b border-dashed border-slate-300 flex items-center justify-center text-slate-400 text-xs">ลายมือชื่อดิจิทัล</div>
                            <input type="text" x-model="formData.inspector_name" @input="saveToStorage()" placeholder="ชื่อ-นามสกุล ผู้ตรวจ" class="w-full border border-slate-200 rounded-xl p-2 text-center text-xs mb-1 bg-white">
                            <input type="text" x-model="formData.inspector_pos" @input="saveToStorage()" placeholder="ตำแหน่ง" class="w-full border border-slate-200 rounded-xl p-2 text-center text-xs bg-white">
                        </div>
                        <div class="space-y-2 text-center border border-slate-200 p-4 rounded-2xl bg-slate-50/50 shadow-sm">
                            <p class="font-bold text-slate-700">ผู้ตรวจสอบ (Verifier)</p>
                            <div class="h-12 border-b border-dashed border-slate-300 flex items-center justify-center text-slate-400 text-xs">ลายมือชื่อดิจิทัล</div>
                            <input type="text" x-model="formData.verifier_name" @input="saveToStorage()" placeholder="ชื่อ-นามสกุล ผู้ตรวจสอบ" class="w-full border border-slate-200 rounded-xl p-2 text-center text-xs mb-1 bg-white">
                            <input type="text" x-model="formData.verifier_pos" @input="saveToStorage()" placeholder="ตำแหน่ง" class="w-full border border-slate-200 rounded-xl p-2 text-center text-xs bg-white">
                        </div>
                    </div>

                </div>
            </div>
        </template>

    </main>

    <!-- AUTOMATED SCRIPT & APP STATE -->
    <script>
        function inspectionApp() {
            return {
                activeFormCode: '',
                activeFormTitle: '',
                autoSaveStatus: '✓ พร้อมบันทึกออโต้',
                currentDate: new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' }),
                
                formsList: [
                    { code: 'SF-07-0-015', name: 'หม้อแปลงจำหน่าย' },
                    { code: 'SF-07-0-016', name: 'Load Break Switch' },
                    { code: 'SF-07-0-017', name: 'Sectionalizer' },
                    { code: 'SF-07-0-018', name: 'Ring Main Unit (RMU)' },
                    { code: 'SF-07-0-019', name: 'UNITSUBSTATION' },
                    { code: 'SF-07-0-020', name: 'Capacitor Bank 12-24 kV' },
                    { code: 'SF-07-0-021', name: 'เครื่องป้องกันหม้อแปลงตาข่าย' },

                    { code: 'SF-07-0-023', name: 'กรองน้ำมันหม้อแปลง' },
                    { code: 'SF-07-0-024', name: 'รายงานจุดร้อนแดง (Hot Spot)' },
                    { code: 'SF-07-0-025', name: 'คายประจุไฟฟ้า (Acoustic Camera)' }
                ],

                formData: {
                    station_id: '', location: '', latitude: '', longitude: '',
                    mea_no1: '', mea_no: '', capacity: '', brand: '', install_style: '',
                    remarks: '', rectification: '', inspector_name: '', inspector_pos: '', verifier_name: '', verifier_pos: ''
                },

                currentChecklistItems: [],

                checklistDatabase: {
                    'SF-07-0-015': [
                        { id: 1, no: '2.1', name: 'Drop Fuse', result: '', defect: '' },
                        { id: 2, no: '2.2', name: 'Station Post Type Insulator', result: '', defect: '' },
                        { id: 3, no: '2.3', name: 'สายเข้า-ออก Drop Fuse', result: '', defect: '' },
                        { id: 4, no: '2.4', name: 'คอนสาย', result: '', defect: '' },
                        { id: 5, no: '2.5', name: 'อุปกรณ์ป้องกันสัตว์', result: '', defect: '' },
                        { id: 6, no: '2.6', name: 'Low Voltage Capacitor', result: '', defect: '' },
                        { id: 7, no: '2.7', name: 'กับดักฟ้าผ่า (L/A)', result: '', defect: '' },
                        { id: 8, no: '2.8', name: 'ตัวถังหม้อแปลง', result: '', defect: '' },
                        { id: 9, no: '2.9', name: 'Bushing HV-LV', result: '', defect: '' },
                        { id: 10, no: '2.10', name: 'Cover (Bushing, L/A, Term. kit)', result: '', defect: '' }
                    ],
                    'SF-07-0-016': [
                        { id: 1, no: '2.1', name: 'ตัวถัง LBS / สลักล็อคการปลดสับ', result: '', defect: '' },
                        { id: 2, no: '2.2', name: 'สถานะก๊าซ SF6', result: '', defect: '' },
                        { id: 3, no: '2.3', name: 'Bushing', result: '', defect: '' },
                        { id: 4, no: '2.4', name: 'กับดักฟ้าผ่า', result: '', defect: '' },
                        { id: 5, no: '2.5', name: 'VT', result: '', defect: '' }
                    ],
                    'SF-07-0-017': [
                        { id: 1, no: '2.1', name: 'ตัวถัง SZ / สลักล็อคการปลดสับ', result: '', defect: '' },
                        { id: 2, no: '2.2', name: 'สถานะก๊าซ SF6', result: '', defect: '' },
                        { id: 3, no: '2.3', name: 'Bushing', result: '', defect: '' }
                    ],
                    'SF-07-0-018': [
                        { id: 1, no: '2.1', name: 'ตู้ครอบ RMU: สภาพภายนอก', result: '', defect: '' },
                        { id: 2, no: '2.2', name: 'ตู้ครอบ RMU: ประตู', result: '', defect: '' },
                        { id: 3, no: '2.4', name: 'RMU: สภาพ RMU / ห้อง', result: '', defect: '' }
                    ],
                    'SF-07-0-019': [
                        { id: 1, no: '2.1', name: 'ตู้ครอบ Encloser: สภาพภายนอก', result: '', defect: '' },
                        { id: 2, no: '2.4', name: 'RMU: สภาพ RMU', result: '', defect: '' },
                        { id: 3, no: '2.20', name: 'หม้อแปลง: ตัวถังหม้อแปลง', result: '', defect: '' }
                    ],
                    'SF-07-0-020': [
                        { id: 1, no: '2.1', name: 'Drop Fuse', result: '', defect: '' },
                        { id: 2, no: '2.9', name: 'Vacuum CB', result: '', defect: '' },
                        { id: 3, no: '2.16', name: 'ตัวถังคาปาซิเตอร์', result: '', defect: '' }
                    ],
                    'SF-07-0-021': [
                        { id: 1, no: '1.1', name: 'สถานะ MV.SW. (CLOSE)', result: '', defect: '' },
                        { id: 2, no: '1.4', name: 'ระบบกราวด์ (N และ G)', result: '', defect: '' },
                        { id: 3, no: '3.1', name: 'อุปกรณ์ภายใน (ไม่มีน้ำหยดเกาะ)', result: '', defect: '' }
                    ],
                    'SF-07-0-022': [
                        { id: 1, no: '1.1', name: 'สวิตช์แรงกลาง: สภาพภายนอก', result: '', defect: '' },
                        { id: 2, no: '2.1', name: 'หม้อแปลง: ตัวถัง', result: '', defect: '' },
                        { id: 3, no: '3.1', name: 'ด้านแรงต่ำ: สายไฟฟ้า', result: '', defect: '' }
                    ],
                    'SF-07-0-023': [
                        { id: 1, no: '1', name: 'ทดสอบน้ำมันหม้อแปลงครั้งที่ 1 (Breakdown Voltage)', result: '', defect: '' },
                        { id: 2, no: '2', name: 'กรองน้ำมันครั้งที่ 1 และทดสอบซ้ำ', result: '', defect: '' }
                    ],
                    'SF-07-0-024': [
                        { id: 1, no: '1', name: 'ตรวจสอบข้อมูลภาพถ่ายความร้อน (Hot Spot Inspection)', result: '', defect: '' },
                        { id: 2, no: '2', name: 'บันทึกอุณหภูมิเปรียบเทียบ (Delta T)', result: '', defect: '' }
                    ],
                    'SF-07-0-025': [
                        { id: 1, no: '1', name: 'ตรวจสอบการคายประจุไฟฟ้าบางส่วน (Acoustic Camera)', result: '', defect: '' }
                    ]
                },

                selectForm(code) {
                    const found = this.formsList.find(f => f.code === code);
                    this.activeFormCode = found.code;
                    this.activeFormTitle = found.name;
                    
                    // โหลดข้อมูลเก่าจาก LocalStorage ถ้ามี
                    const savedData = localStorage.getItem('mea_form_' + code);
                    if (savedData) {
                        const parsed = JSON.parse(savedData);
                        this.formData = parsed.formData || {};
                        this.currentChecklistItems = parsed.items || [];
                    } else {
                        this.formData = { station_id: '', location: '', latitude: '', longitude: '', mea_no1: '', mea_no: '', capacity: '', brand: '', install_style: '', remarks: '', rectification: '', inspector_name: '', inspector_pos: '', verifier_name: '', verifier_pos: '' };
                        this.currentChecklistItems = JSON.parse(JSON.stringify(this.checklistDatabase[code] || []));
                    }
                    window.scrollTo({ top: 120, behavior: 'smooth' });
                },

                saveToStorage() {
                    if (!this.activeFormCode) return;
                    const dataToSave = {
                        formData: this.formData,
                        items: this.currentChecklistItems
                    };
                    localStorage.setItem('mea_form_' + this.activeFormCode, JSON.stringify(dataToSave));
                    this.autoSaveStatus = '✓ บันทึกอัตโนมัติแล้ว';
                    setTimeout(() => { this.autoSaveStatus = '✓ พร้อมใช้งาน'; }, 2000);
                },

                markAllNormal() {
                    this.currentChecklistItems.forEach(item => { item.result = 'normal'; });
                    this.saveToStorage();
                },

                resetForm() {
                    if (confirm('คุณต้องการล้างข้อมูลทั้งหมดในใบงานนี้ใช่หรือไม่?')) {
                        localStorage.removeItem('mea_form_' + this.activeFormCode);
                        this.selectForm(this.activeFormCode);
                    }
                },

                get checkedCount() {
                    return this.currentChecklistItems.filter(i => i.result !== '').length;
                },

                get totalItems() {
                    return this.currentChecklistItems.length;
                },

                get progressPercentage() {
                    if (this.totalItems === 0) return 0;
                    return Math.round((this.checkedCount / this.totalItems) * 100);
                },

                getGPS() {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(position => {
                            this.formData.latitude = position.coords.latitude.toFixed(6);
                            this.formData.longitude = position.coords.longitude.toFixed(6);
                            this.saveToStorage();
                            alert('📍 ดึงพิกัด GPS สำเร็จ');
                        }, error => {
                            alert('ไม่สามารถดึงตำแหน่งพิกัดได้ กรุณาเปิดใช้งาน Location GPS');
                        });
                    } else {
                        alert('Browser ของคุณไม่รองรับการระบุพิกัด');
                    }
                },

                validateAndSubmit() {
                    if (this.checkedCount < this.totalItems) {
                        alert('⚠ กรุณาตรวจสอบผลการตรวจสอบให้ครบทุกข้อก่อนส่ง');
                        return;
                    }
                    alert('✓ ส่งใบตรวจสอบเรียบร้อยแล้ว ระบบบันทึกข้อมูลสำเร็จ!');
                },

                exportPDF() {
                    window.print();
                }
            }
        }
    </script>
