<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแบบฟอร์มตรวจสอบบำรุงรักษาอุปกรณ์ไฟฟ้า PEA</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-gray-100 text-gray-800 pb-12">

    <!-- Top Navigation Bar -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
            <span class="px-2.5 py-1 bg-amber-100 text-amber-800 text-xs font-semibold rounded">สถานะ: พร้อมใช้งานระบบบันทึกข้อมูลสนาม</span>
            <select id="formSelector" class="border border-gray-300 rounded px-3 py-1.5 text-sm font-medium bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="015">SF-07-0-015: หม้อแปลงจำหน่าย</option>
                <option value="016">SF-07-0-016: Load Break Switch</option>
                <option value="017">SF-07-0-017: Sectionalizer</option>
                <option value="018">SF-07-0-018: Ring Main Unit (RMU)</option>
                <option value="019">SF-07-0-019: Unit Substation</option>
                <option value="020">SF-07-0-020: Capacitor Bank 12-24 kV</option>
                <option value="021">SF-07-0-021: เครื่องป้องกันหม้อแปลงตาข่าย</option>
                <option value="022">SF-07-0-022: หม้อแปลงวงจรตาข่ายและสวิตช์แรงกลาง</option>
                <option value="023">SF-07-0-023: ทดสอบและกรองน้ำมันหม้อแปลง</option>
                <option value="024">SF-07-0-024: รายงานจุดร้อนแดง (Hot Spot)</option>
                <option value="025">SF-07-0-025: รายงานตรวจสอบ Partial Discharge (Acoustic Camera)</option>
            </select>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-6">
        <!-- Dynamic Form Container -->
        <div class="bg-white rounded-lg shadow-md border border-gray-300 overflow-hidden">
            <div id="formTitleBar" class="bg-blue-900 text-white text-center py-3 font-semibold text-base">
                แบบตรวจสอบบำรุงรักษาหม้อแปลงจำหน่าย (SF-07-0-015)
            </div>
            <div class="p-6" id="formContentArea">
                <!-- เนื้อหาฟอร์มจะเปลี่ยนไปตามตัวเลือกด้านบน -->
                <p class="text-sm text-gray-600 text-center py-8">กำลังโหลดแบบฟอร์ม...</p>
            </div>
        </div>
    </main>

    <script>
        const formSelector = document.getElementById('formSelector');
        const formTitleBar = document.getElementById('formTitleBar');
        const formContentArea = document.getElementById('formContentArea');

        const formTemplates = {
            "015": "แบบตรวจสอบบำรุงรักษาหม้อแปลงจำหน่าย (SF-07-0-015)",
            "016": "แบบตรวจสอบบำรุงรักษา Load Break Switch (SF-07-0-016)",
            "017": "แบบตรวจสอบบำรุงรักษา Sectionalizer (SF-07-0-017)",
            "018": "แบบตรวจสอบบำรุงรักษา Ring Main Unit (RMU) (SF-07-0-018)",
            "019": "แบบตรวจสอบบำรุงรักษา Unit Substation (SF-07-0-019)",
            "020": "แบบตรวจสอบบำรุงรักษา Capacitor Bank 12-24 kV ในสายป้อน (SF-07-0-020)",
            "021": "แบบตรวจสอบบำรุงรักษาเครื่องป้องกันหม้อแปลงวงจรตาข่าย (SF-07-0-021)",
            "022": "แบบตรวจสอบบำรุงรักษาหม้อแปลงวงจรตาข่ายและสวิตช์แรงกลาง (SF-07-0-022)",
            "023": "แบบตรวจสอบบำรุงรักษาทดสอบและกรองน้ำมันหม้อแปลงวงจรตาข่าย (SF-07-0-023)",
            "024": "รายงานผลการตรวจสอบจุดร้อนแดง (Hot Spot) (SF-07-0-024)",
            "025": "รายงานผลการตรวจสอบการคายประจุไฟฟ้าบางส่วน (Partial Discharge) ด้วย Acoustic Camera (SF-07-0-025)"
        };

        formSelector.addEventListener('change', (e) => {
            const val = e.target.value;
            formTitleBar.innerText = formTemplates[val];

            if (val === "025") {
                // Layout สำหรับ SF-07-0-025 (Partial Discharge)
                formContentArea.innerHTML = `
                    <div class="space-y-4 text-xs">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-50 p-3 rounded border">
                            <div><label class="block text-gray-500 mb-1">ผู้ตรวจคนที่ 1:</label><input type="text" class="border rounded px-2 py-1 w-full bg-white"></div>
                            <div><label class="block text-gray-500 mb-1">ตำแหน่ง / วันที่ตรวจ:</label><div class="flex gap-2"><input type="text" class="border rounded px-2 py-1 flex-1 bg-white" placeholder="ตำแหน่ง"><input type="date" class="border rounded px-2 py-1 w-36 bg-white"></div></div>
                            <div><label class="block text-gray-500 mb-1">ผู้ตรวจคนที่ 2:</label><input type="text" class="border rounded px-2 py-1 w-full bg-white"></div>
                            <div><label class="block text-gray-500 mb-1">ตำแหน่ง:</label><input type="text" class="border rounded px-2 py-1 w-full bg-white"></div>
                        </div>

                        <div class="bg-gray-100 p-2 font-semibold text-gray-700 rounded">1. ข้อมูลภาพถ่ายและพิกัดอุปกรณ์</div>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                            <div><span class="text-gray-500 block mb-1">Station ID</span><input type="text" class="border rounded px-2 py-1 w-full"></div>
                            <div><span class="text-gray-500 block mb-1">อุปกรณ์</span><input type="text" class="border rounded px-2 py-1 w-full"></div>
                            <div><span class="text-gray-500 block mb-1">MEA No.</span><input type="text" class="border rounded px-2 py-1 w-full"></div>
                            <div><span class="text-gray-500 block mb-1">สถานที่</span><input type="text" class="border rounded px-2 py-1 w-full"></div>
                            <div><span class="text-gray-500 block mb-1">สายป้อน</span><input type="text" class="border rounded px-2 py-1 w-full"></div>
                            <div><span class="text-gray-500 block mb-1">GIS Lat / Long</span><div class="flex gap-1"><input type="text" class="border rounded px-1 py-1 w-1/2" placeholder="Lat"><input type="text" class="border rounded px-1 py-1 w-1/2" placeholder="Long"></div></div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border p-3 rounded">
                            <div><span class="text-gray-500 block mb-1">จุดที่ผิดปกติ</span><input type="text" class="border rounded px-2 py-1 w-full mb-3"></div>
                            <div>
                                <span class="text-gray-500 block mb-1">ระดับความเข้มเสียงที่ตรวจวัดได้ (dB)</span>
                                <div class="flex items-center gap-2">
                                    <input type="text" class="border rounded px-2 py-1 w-32 font-bold text-center" placeholder="0.0"> <span class="text-gray-500">dB</span>
                                </div>
                            </div>
                            <div class="col-span-full">
                                <span class="text-gray-500 block mb-1">ระดับความรุนแรง (ประเมินจาก Software NL CLOUD)</span>
                                <div class="flex flex-wrap gap-4 mt-1">
                                    <label class="flex items-center gap-1"><input type="radio" name="severity" class="accent-red-600"> สูงมาก</label>
                                    <label class="flex items-center gap-1"><input type="radio" name="severity" class="accent-orange-500"> สูง</label>
                                    <label class="flex items-center gap-1"><input type="radio" name="severity" class="accent-yellow-500"> ปานกลาง</label>
                                    <label class="flex items-center gap-1"><input type="radio" name="severity" class="accent-blue-500"> ต่ำ</label>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="border border-dashed p-4 rounded text-center text-gray-400">📷 ภาพถ่ายจากกล้องปกติ</div>
                            <div class="border border-dashed p-4 rounded text-center text-gray-400">🔊 ภาพถ่ายจาก Acoustic Camera</div>
                        </div>

                        <div class="bg-gray-100 p-2 font-semibold text-gray-700 rounded">2. การส่งต่อดำเนินการแก้ไข</div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><span class="text-gray-500 block mb-1">ส่งต่อให้กลุ่มงาน</span><input type="text" class="border rounded px-2 py-1 w-full"></div>
                            <div><span class="text-gray-500 block mb-1">วันที่ส่งเรื่อง</span><input type="date" class="border rounded px-2 py-1 w-full"></div>
                        </div>
                    </div>
                `;
            } else {
                // Layout พื้นฐานสำหรับฟอร์มอื่นๆ
                formContentArea.innerHTML = `
                    <div class="space-y-4">
                        <div class="bg-gray-100 p-3 rounded text-xs font-semibold text-gray-700">1. ข้อมูลทั่วไปและพิกัดอุปกรณ์</div>
                        <div class="grid grid-cols-2 gap-4 text-xs">
                            <div class="flex border-b pb-2"><span class="w-28 text-gray-500">Station ID:</span> <input type="text" class="border rounded px-2 py-1 flex-1"></div>
                            <div class="flex border-b pb-2"><span class="w-28 text-gray-500">สถานที่:</span> <input type="text" class="border rounded px-2 py-1 flex-1"></div>
                        </div>
                        <div class="bg-gray-100 p-3 rounded text-xs font-semibold text-gray-700">2. รายการตรวจสอบและผลการปฏิบัติงาน</div>
                        <div class="border rounded p-6 text-center text-xs text-gray-500">
                            โครงสร้างตารางและรายการตรวจสอบของ <span class="font-semibold text-blue-600">${formTemplates[val]}</span> พร้อมบันทึกผล ปกติ / ชำรุด / ไม่มี
                        </div>
                    </div>
                `;
            }
        });

        // Load default
        formSelector.dispatchEvent(new Event('change'));
    </script>
</body>
</html>
