<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Inspection & PM Cost Management - MEA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts (Sarabun) -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            padding: 15mm;
            margin: 0 auto;
            background: white;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
        }
        @media print {
            body { background: white; }
            .no-print { display: none !important; }
            .a4-page { box-shadow: none; padding: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased" x-data="inspectionApp()">

    <!-- HEADER BAR -->
    <header class="no-print sticky top-0 z-50 bg-slate-900 text-white shadow-lg px-6 py-3 flex flex-wrap justify-between items-center border-b border-slate-800">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-sm font-bold shadow">⚡</div>
            <div>
                <h1 class="text-sm font-bold tracking-wide text-white">Digital PM & Inspection Management</h1>
                <p class="text-[11px] text-slate-400">ระบบตรวจสอบไฟฟ้า กฟน. • เชื่อมโยงต้นทุนและลำดับความสำคัญงาน PM</p>
            </div>
        </div>
        <div class="flex items-center space-x-3 text-sm mt-1 sm:mt-0">
            <span class="text-[11px] bg-slate-800 text-emerald-400 px-2.5 py-1 rounded-full border border-slate-700 font-medium" x-text="autoSaveStatus"></span>
            <template x-if="activeFormCode">
                <button @click="exportPDF()" class="bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-1.5 rounded-lg transition font-medium text-xs shadow flex items-center gap-1">
                    🖨️ พิมพ์ / PDF
                </button>
            </template>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="py-4 px-4 max-w-7xl mx-auto space-y-4">

        <!-- COMPACT FORM SELECTOR GRID -->
        <div class="no-print bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                <div>
                    <h2 class="text-sm font-bold text-slate-900">📋 เลือกประเภทใบตรวจสอบภาคสนาม (11 แบบฟอร์มมาตรฐาน)</h2>
                </div>
                <div class="w-full sm:w-64">
                    <input type="text" x-model="searchQuery" placeholder="🔍 ค้นหารหัส หรือ ชื่ออุปกรณ์..." class="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs outline-none focus:border-blue-500 bg-slate-50">
                </div>
            </div>

            <!-- Compact Grid Cards -->
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2 max-h-48 overflow-y-auto p-1">
                <template x-for="form in filteredForms" :key="form.code">
                    <button @click="selectForm(form.code)" 
                        :class="activeFormCode === form.code ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200'"
                        class="p-2 rounded-xl text-left transition border flex flex-col justify-between gap-1">
                        <span class="text-[10px] font-bold px-1.5 py-0.5 rounded w-max" :class="activeFormCode === form.code ? 'bg-blue-500 text-white' : 'bg-slate-200 text-slate-600'" x-text="form.code"></span>
                        <span class="text-[11px] font-semibold line-clamp-1" x-text="form.name"></span>
                    </button>
                </template>
            </div>
        </div>

        <!-- Welcome State -->
        <template x-if="!activeFormCode">
            <div class="text-center py-12 space-y-2 bg-white rounded-2xl border border-slate-200 shadow-sm max-w-md mx-auto p-6">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl mx-auto">👆</div>
                <h3 class="text-sm font-bold text-slate-900">กรุณาเลือกใบงานด้านบนเพื่อเริ่มต้น</h3>
                <p class="text-[11px] text-slate-500">พร้อมฟังก์ชันวางแผน PM, ประเมินความสำคัญ และคำนวณต้นทุนซ่อมบำรุง</p>
            </div>
        </template>

        <!-- Active Form Layout -->
        <template x-if="activeFormCode">
            <div class="space-y-4">
                
                <!-- Quick Control Toolbar -->
                <div class="max-w-[210mm] mx-auto bg-white p-3 rounded-xl shadow-sm border border-slate-200 no-print flex flex-col sm:flex-row justify-between items-center gap-3">
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <button @click="markAllNormal()" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1">
                            ✅ ติ๊ก "ปกติ" ทั้งหมดด่วน
                        </button>
                        <button @click="resetForm()" class="bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                            🔄 ล้างข้อมูล
                        </button>
                    </div>
                    <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                        <div class="text-xs font-semibold text-slate-600">
                            ตรวจแล้ว: <span class="text-blue-600 font-bold" x-text="checkedCount"></span> / <span x-text="totalItems"></span> (<span x-text="progressPercentage"></span>%)
                        </div>
                        <button @click="validateAndSubmit()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-lg font-bold text-xs transition shadow-sm">
                            ✓ ส่งใบตรวจสอบ
                        </button>
                    </div>
                </div>

                <!-- A4 Form Sheet -->
                <div class="a4-page rounded-xl border border-slate-200 text-slate-900 text-sm space-y-4">
                    
                    <!-- Header -->
                    <div class="border-b border-slate-200 pb-3 flex justify-between items-start">
                        <div>
                            <span class="text-[11px] font-bold text-blue-600 bg-blue-50 px-2.5 py-0.5 rounded border border-blue-100" x-text="activeFormCode"></span>
                            <h2 class="text-base font-bold text-slate-900 mt-1.5" x-text="activeFormTitle"></h2>
                            <p class="text-[11px] text-slate-400">การไฟฟ้านครหลวง (MEA) • ระบบบันทึกข้อมูลภาคสนามและบริหารต้นทุน PM</p>
                        </div>
                        <div class="text-right text-xs text-slate-500 font-medium">
                            วันที่: <span class="text-slate-900 font-semibold" x-text="currentDate"></span>
                        </div>
                    </div>

                    <!-- Section 1: General Info & PM Prioritization / Cost Linking -->
                    <div class="space-y-2">
                        <h3 class="font-bold text-[11px] uppercase tracking-wider text-slate-500 bg-slate-50 px-2.5 py-1.5 rounded-lg border-l-4 border-blue-600">1. ข้อมูลทั่วไปและการวางแผน PM (ความสำคัญ & ต้นทุน)</h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5 text-xs">
                            <div><label class="block font-medium text-slate-500 mb-0.5">Station ID / FIX ID</label><input type="text" x-model="formData.station_id" @input="saveToStorage()" class="w-full border border-slate-200 rounded-lg p-1.5 outline-none bg-slate-50/50"></div>
                            <div><label class="block font-medium text-slate-500 mb-0.5">สถานที่ติดตั้ง</label><input type="text" x-model="formData.location" @input="saveToStorage()" class="w-full border border-slate-200 rounded-lg p-1.5 outline-none bg-slate-50/50"></div>
                            <div><label class="block font-medium text-slate-500 mb-0.5">GIS Lat.</label><input type="text" x-model="formData.latitude" class="w-full border border-slate-200 rounded-lg p-1.5 bg-slate-50" readonly></div>
                            <div><label class="block font-medium text-slate-500 mb-0.5">GIS Long.</label><div class="flex gap-1"><input type="text" x-model="formData.longitude" class="w-full border border-slate-200 rounded-lg p-1.5 bg-slate-50" readonly><button @click="getGPS()" class="bg-blue-600 text-white px-2 rounded-lg">📍</button></div></div>
                            
                            <!-- New Fields: Priority & Cost Planning -->
                            <div>
                                <label class="block font-medium text-slate-500 mb-0.5">⭐ ลำดับความสำคัญงาน (Priority)</label>
                                <select x-model="formData.priority" @change="saveToStorage()" class="w-full border border-slate-200 rounded-lg p-1.5 bg-white font-semibold text-blue-600">
                                    <option value="High">🔴 สูงมาก (High - เร่งด่วน)</option>
                                    <option value="Medium">🟡 ปานกลาง (Medium)</option>
                                    <option value="Low">🟢 ปกติ (Low - ตามรอบ)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block font-medium text-slate-500 mb-0.5">💰 ประมาณการค่าใช้จ่าย PM (บาท)</label>
                                <input type="number" x-model="formData.pm_cost" @input="saveToStorage()" placeholder="ระบุงบประมาณซ่อมแซม" class="w-full border border-slate-200 rounded-lg p-1.5 bg-slate-50/50">
                            </div>
                            <div><label class="block font-medium text-slate-500 mb-0.5">MEA No.</label><input type="text" x-model="formData.mea_no" @input="saveToStorage()" class="w-full border border-slate-200 rounded-lg p-1.5 bg-slate-50/50"></div>
                            <div><label class="block font-medium text-slate-500 mb-0.5">ยี่ห้ออุปกรณ์ (Brand)</label><input type="text" x-model="formData.brand" @input="saveToStorage()" class="w-full border border-slate-200 rounded-lg p-1.5 bg-slate-50/50"></div>
                        </div>
                    </div>

                    <!-- Section 2: Checklist Table -->
                    <div class="space-y-2">
                        <div class="flex justify-between items-center bg-slate-50 px-2.5 py-1.5 rounded-lg border-l-4 border-blue-600">
                            <h3 class="font-bold text-[11px] uppercase tracking-wider text-slate-500">2. รายการตรวจสอบบำรุงรักษา (ครบถ้วนตามต้นฉบับ)</h3>
                            <span class="text-[10px] text-blue-600 font-semibold">💡 คลิกเลือกสถานะได้ทันทีทุกข้อ</span>
                        </div>
                        <div class="overflow-x-auto border border-slate-200 rounded-xl shadow-sm">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-slate-50/80 border-b border-slate-200 text-slate-600">
                                        <th class="p-2 w-12 text-center font-semibold">ลำดับ</th>
                                        <th class="p-2 font-semibold">รายการตรวจสอบ</th>
                                        <th class="p-2 w-16 text-center font-semibold text-emerald-600">ปกติ</th>
                                        <th class="p-2 w-16 text-center font-semibold text-rose-600">ชำรุด</th>
                                        <th class="p-2 w-16 text-center font-semibold text-slate-500">ไม่มี</th>
                                        <th class="p-2 w-48 font-semibold">ข้อบกพร่อง / การดำเนินการ</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    <template x-for="(item, index) in currentChecklistItems" :key="item.id">
                                        <tr class="hover:bg-blue-50/30 transition">
                                            <td class="p-2 text-center font-bold text-slate-500" x-text="item.no"></td>
                                            <td class="p-2 font-medium text-slate-800" x-text="item.name"></td>
                                            <td class="p-2 text-center">
                                                <input type="radio" :name="'item_' + item.id" value="normal" x-model="item.result" @change="saveToStorage()" class="w-3.5 h-3.5 text-emerald-600 cursor-pointer accent-emerald-600">
                                            </td>
                                            <td class="p-2 text-center">
                                                <input type="radio" :name="'item_' + item.id" value="damaged" x-model="item.result" @change="saveToStorage()" class="w-3.5 h-3.5 text-rose-600 cursor-pointer accent-rose-600">
                                            </td>
                                            <td class="p-2 text-center">
                                                <input type="radio" :name="'item_' + item.id" value="none" x-model="item.result" @change="saveToStorage()" class="w-3.5 h-3.5 text-slate-400 cursor-pointer accent-slate-500">
                                            </td>
                                            <td class="p-2">
                                                <input type="text" x-model="item.defect" @input="saveToStorage()" placeholder="ระบุข้อบกพร่อง" class="w-full border border-slate-200 rounded-lg p-1.5 text-xs outline-none focus:border-blue-500 bg-slate-50/30">
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Section 3 & 4 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div class="space-y-1.5">
                            <h3 class="font-bold text-[11px] uppercase tracking-wider text-slate-500 bg-slate-50 px-2.5 py-1.5 rounded-lg border-l-4 border-blue-600">3. ข้อเสนอแนะ / ข้อมูลเพิ่มเติม</h3>
                            <textarea x-model="formData.remarks" @input="saveToStorage()" rows="2" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-blue-500 bg-slate-50/30" placeholder="ระบุรายละเอียด..."></textarea>
                        </div>
                        <div class="space-y-1.5">
                            <h3 class="font-bold text-[11px] uppercase tracking-wider text-slate-500 bg-slate-50 px-2.5 py-1.5 rounded-lg border-l-4 border-blue-600">4. การปรับปรุงข้อบกพร่อง & ต้นทุนจริง</h3>
                            <textarea x-model="formData.rectification" @input="saveToStorage()" rows="2" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-blue-500 bg-slate-50/30" placeholder="ระบุการแก้ไขและค่าใช้จ่ายเพิ่มเติม..."></textarea>
                        </div>
                    </div>

                    <!-- Section 5: Signatures -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-3 border-t border-slate-200 text-xs">
                        <div class="space-y-1.5 text-center border border-slate-200 p-3 rounded-xl bg-slate-50/50 shadow-sm">
                            <p class="font-bold text-slate-700">ผู้ตรวจ (Inspector)</p>
                            <div class="h-8 border-b border-dashed border-slate-300 flex items-center justify-center text-slate-400 text-[10px]">ลายมือชื่อดิจิทัล</div>
                            <input type="text" x-model="formData.inspector_name" @input="saveToStorage()" placeholder="ชื่อ-นามสกุล ผู้ตรวจ" class="w-full border border-slate-200 rounded-lg p-1.5 text-center text-xs mb-1 bg-white">
                            <input type="text" x-model="formData.inspector_pos" @input="saveToStorage()" placeholder="ตำแหน่ง" class="w-full border border-slate-200 rounded-lg p-1.5 text-center text-xs bg-white">
                        </div>
                        <div class="space-y-1.5 text-center border border-slate-200 p-3 rounded-xl bg-slate-50/50 shadow-sm">
                            <p class="font-bold text-slate-700">ผู้ตรวจสอบ (Verifier)</p>
                            <div class="h-8 border-b border-dashed border-slate-300 flex items-center justify-center text-slate-400 text-[10px]">ลายมือชื่อดิจิทัล</div>
                            <input type="text" x-model="formData.verifier_name" @input="saveToStorage()" placeholder="ชื่อ-นามสกุล ผู้ตรวจสอบ" class="w-full border border-slate-200 rounded-lg p-1.5 text-center text-xs mb-1 bg-white">
                            <input type="text" x-model="formData.verifier_pos" @input="saveToStorage()" placeholder="ตำแหน่ง" class="w-full border border-slate-200 rounded-lg p-1.5 text-center text-xs bg-white">
                        </div>
                    </div>

                </div>
            </div>
        </template>

    </main>

    <!-- SCRIPT -->
    <script>
        function inspectionApp() {
            return {
                activeFormCode: '',
                activeFormTitle: '',
                searchQuery: '',
                autoSaveStatus: '✓ พร้อมใช้งาน',
                currentDate: new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' }),
                
                formsList: [
                    { code: 'SF-07-0-015', name: 'หม้อแปลงจำหน่าย' },
                    { code: 'SF-07-0-016', name: 'Load Break Switch' },
                    { code: 'SF-07-0-017', name: 'Sectionalizer' },
                    { code: 'SF-07-0-018', name: 'Ring Main Unit (RMU)' },
                    { code: 'SF-07-0-019', name: 'UNITSUBSTATION' },
                    { code: 'SF-07-0-020', name: 'Capacitor Bank 12-24 kV' },
                    { code: 'SF-07-0-021', name: 'เครื่องป้องกันหม้อแปลงตาข่าย' },
                    { code: 'SF-07-0-022', name: 'หม้อแปลงตาข่ายและสวิตช์แรงกลาง' },
                    { code: 'SF-07-0-023', name: 'กรองน้ำมันหม้อแปลง' },
                    { code: 'SF-07-0-024', name: 'รายงานจุดร้อนแดง (Hot Spot)' },
                    { code: 'SF-07-0-025', name: 'คายประจุไฟฟ้า (Acoustic Camera)' }
                ],

                get filteredForms() {
                    if (!this.searchQuery) return this.formsList;
                    return this.formsList.filter(f => f.code.toLowerCase().includes(this.searchQuery.toLowerCase()) || f.name.toLowerCase().includes(this.searchQuery.toLowerCase()));
                },

                formData: {
                    station_id: '', location: '', latitude: '', longitude: '', mea_no: '', brand: '',
                    priority: 'Medium', pm_cost: '',
                    remarks: '', rectification: '', inspector_name: '', inspector_pos: '', verifier_name: '', verifier_pos: ''
                },

                currentChecklistItems: [],

                checklistDatabase: {
                    'SF-07-0-015': [
                        { id: 1, no: '2.1', name: 'Drop Fuse', result: '', defect: '' },
                        { id: 2, no: '2.2', name: 'Station Post Type Insulator', result: '', defect: '' },
                        { id: 3, no: '2.3', name: 'สายเข้า-ออก Drop Fuse', result: '', defect: '' },
                        { id: 4, no: '2.4', name: 'คอนสาย', result: '', defect: '' },
                        { id: 5, no: '2.5', name: 'อุปกรณ์ป้องกันสัตว์', result: '', defect: '' },
                        { id: 6, no: '2.6', name: 'Low Voltage Capacitor', result: '', defect: '' },
                        { id: 7, no: '2.7', name: 'กับดักฟ้าผ่า (L/A)', result: '', defect: '' },
                        { id: 8, no: '2.8', name: 'ตัวถังหม้อแปลง', result: '', defect: '' },
                        { id: 9, no: '2.9', name: 'Bushing HV-LV', result: '', defect: '' },
                        { id: 10, no: '2.10', name: 'Cover (Bushing, L/A, Term. kit)', result: '', defect: '' },
                        { id: 11, no: '2.11', name: 'สายหน้าหม้อแปลง LV', result: '', defect: '' },
                        { id: 12, no: '2.12', name: 'LV Ground', result: '', defect: '' },
                        { id: 13, no: '2.13', name: 'HV Ground', result: '', defect: '' },
                        { id: 14, no: '2.14', name: 'CT-TLM Meter (ถ้ามี)', result: '', defect: '' }
                    ],
                    'SF-07-0-016': [
                        { id: 1, no: '2.1', name: 'ตัวถัง LBS / สลักล็อคการปลดสับ', result: '', defect: '' },
                        { id: 2, no: '2.2', name: 'สถานะก๊าซ SF6', result: '', defect: '' },
                        { id: 3, no: '2.3', name: 'Bushing', result: '', defect: '' },
                        { id: 4, no: '2.4', name: 'กับดักฟ้าผ่า', result: '', defect: '' },
                        { id: 5, no: '2.5', name: 'VT', result: '', defect: '' },
                        { id: 6, no: '2.6', name: 'Drop Fuse ลง VT', result: '', defect: '' },
                        { id: 7, no: '2.7', name: 'คอนสาย', result: '', defect: '' },
                        { id: 8, no: '2.8', name: 'สายควบคุม LBS', result: '', defect: '' },
                        { id: 9, no: '2.9', name: 'อุปกรณ์ป้องกันสัตว์ Control/FRTU/Ground', result: '', defect: '' },
                        { id: 10, no: '2.10', name: 'ไฟสถานะหน้าตู้', result: '', defect: '' },
                        { id: 11, no: '2.11', name: 'แหล่งจ่ายไฟฟ้า และสายควบคุม', result: '', defect: '' },
                        { id: 12, no: '2.12', name: 'สภาพแบตเตอรี่หรือ Capacitor', result: '', defect: '' },
                        { id: 13, no: '2.13', name: 'Ground HV (L/A, LBS)', result: '', defect: '' },
                        { id: 14, no: '2.14', name: 'Ground LV (ดู Control)', result: '', defect: '' },
                        { id: 15, no: '2.15', name: 'ทดสอบ ปลด/สับ ทาง Remote', result: '', defect: '' },
                        { id: 16, no: '2.16', name: 'ทดสอบ ปลด/สับ ทาง Local', result: '', defect: '' },
                        { id: 17, no: '2.17', name: 'แรงดันไฟฟ้าเลี้ยงอุปกรณ์ (ทดสอบ ATS)', result: '', defect: '' },
                        { id: 18, no: '2.18', name: 'การทดสอบ ATS', result: '', defect: '' }

                selectForm(code) {
                    const found = this.formsList.find(f => f.code === code);
                    this.activeFormCode = found.code;
                    this.activeFormTitle = found.name;
                    
                    const savedData = localStorage.getItem('mea_form_' + code);
                    if (savedData) {
                        const parsed = JSON.parse(savedData);
                        this.formData = parsed.formData || {};
                        this.currentChecklistItems = parsed.items || [];
                    } else {
                        const lastInspector = localStorage.getItem('mea_last_inspector') || '';
                        const lastPos = localStorage.getItem('mea_last_pos') || '';
                        
                        this.formData = { station_id: '', location: '', latitude: '', longitude: '', mea_no: '', brand: '', priority: 'Medium', pm_cost: '', remarks: '', rectification: '', inspector_name: lastInspector, inspector_pos: lastPos, verifier_name: '', verifier_pos: '' };
                        this.currentChecklistItems = JSON.parse(JSON.stringify(this.checklistDatabase[code] || []));
                    }
                },

                saveToStorage() {
                    if (!this.activeFormCode) return;
                    const dataToSave = {
                        formData: this.formData,
                        items: this.currentChecklistItems
                    };
                    localStorage.setItem('mea_form_' + this.activeFormCode, JSON.stringify(dataToSave));
                    
                    if (this.formData.inspector_name) localStorage.setItem('mea_last_inspector', this.formData.inspector_name);
                    if (this.formData.inspector_pos) localStorage.setItem('mea_last_pos', this.formData.inspector_pos);

                    this.autoSaveStatus = '✓ บันทึกออโต้แล้ว';
                    setTimeout(() => { this.autoSaveStatus = '✓ พร้อมใช้งาน'; }, 2000);
                },

                markAllNormal() {
                    this.currentChecklistItems.forEach(item => { item.result = 'normal'; });
                    this.saveToStorage();
                },

                resetForm() {
                    if (confirm('คุณต้องการล้างข้อมูลทั้งหมดในใบงานนี้ใช่หรือไม่?')) {
                        localStorage.removeItem('mea_form_' + this.activeFormCode);
                        this.selectForm(this.activeFormCode);
                    }
                },

                get checkedCount() {
                    return this.currentChecklistItems.filter(i => i.result !== '').length;
                },

                get totalItems() {
                    return this.currentChecklistItems.length;
                },

                get progressPercentage() {
                    if (this.totalItems === 0) return 0;
                    return Math.round((this.checkedCount / this.totalItems) * 100);
                },

                getGPS() {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(position => {
                            this.formData.latitude = position.coords.latitude.toFixed(6);
                            this.formData.longitude = position.coords.longitude.toFixed(6);
                            this.saveToStorage();
                            alert('📍 ดึงพิกัด GPS สำเร็จ');
                        }, error => {
                            alert('ไม่สามารถดึงตำแหน่งพิกัดได้ กรุณาเปิดใช้งาน Location GPS');
                        });
                    } else {
                        alert('Browser ของคุณไม่รองรับการระบุพิกัด');
                    }
                },

                validateAndSubmit() {
                    if (this.checkedCount < this.totalItems) {
                        alert('⚠ กรุณาตรวจสอบผลการตรวจสอบให้ครบทุกข้อก่อนส่ง');
                        return;
                    }
                    alert('✓ ส่งใบตรวจสอบและบันทึกแผนงาน PM สำเร็จ!');
                },

                exportPDF() {
                    window.print();
                }
            }
