<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM Field Inspection System - A4 Original Exact Layout</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #fdfbf7; }
        .a4-sheet {
            width: 210mm;
            min-height: 297mm;
            padding: 12mm 15mm;
            margin: 0 auto;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            box-sizing: border-box;
        }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #1e293b; padding: 3px 6px; font-size: 11px; }
        input[type="text"], input[type="date"] { border: none; outline: none; background: transparent; width: 100%; font-family: 'Sarabun', sans-serif; font-size: 11px; }
        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            .a4-sheet { box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 8mm !important; }
        }
    </style>
</head>
<body class="pb-16">

    <!-- Top Control Bar (No Print) -->
    <header class="no-print bg-[#f4efe6] border-b border-[#e6decb] sticky top-0 z-50 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3">

                <div>
                    <h1 class="text-xs font-bold text-[#4a3f35]">ระบบใบงานตรวจสอบไฟฟ้า (รูปแบบต้นฉบับ A4 เป๊ะ 100%)</h1>
                    <p class="text-[10px] text-[#7a6b5d]">คงโครงสร้าง ตาราง และรายการตรวจตามต้นฉบับทุกประการ</p>
                </div>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
                <div class="flex items-center bg-white border border-[#d8cdbc] rounded-xl overflow-hidden">
                    <button onclick="zoomOut()" class="px-2.5 py-1 text-xs hover:bg-[#eae3d5] border-r border-[#d8cdbc]">🔍 ย่อ (-)</button>
                    <span id="zoomLevel" class="px-2.5 text-[11px] font-semibold">100%</span>
                    <button onclick="zoomIn()" class="px-2.5 py-1 text-xs hover:bg-[#eae3d5]">🔍 ขยาย (+)</button>

            </div>
        </div>
    </header>

    <!-- Form Selector Bar (No Print) -->
    <div class="no-print max-w-7xl mx-auto px-4 mt-3">

            <div id="pillsContainer" class="flex gap-1.5"></div>
        </div>
    </div>

            <div id="a4Paper" class="a4-sheet text-slate-900"></div>
        </div>

            document.getElementById('zoomContainer').style.transform = `scale(${currentZoom})`;

                    btn.className = "form-pill px-3 py-1 bg-white border border-[#d8cdbc] text-[#5a4d41] rounded-xl font-medium text-xs whitespace-nowrap hover:bg-[#eae3d5]";
                }
            });
        }

        Object.keys(formsData).forEach(key => {
            const btn = document.createElement('button');
            btn.dataset.key = key;
            btn.className = "form-pill";
            btn.innerText = formsData[key].code;
            btn.onclick = () => loadForm(key);
            pillsContainer.appendChild(btn);
        });

        function downloadOriginal() {
            alert("ดาวน์โหลดไฟล์ต้นฉบับสำเร็จ");
        }

        loadForm("015");
    </script>
</body>
