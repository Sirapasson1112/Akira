                    ${form.generalHTML}
                </div>

                <!-- Section 2: Inspection Items -->
                <div class="space-y-1 mt-4">
                    <div class="bg-slate-800 text-white px-2 py-1 font-bold text-xs">2. รายการตรวจสอบบำรุงรักษา</div>
                    <table class="w-full border-collapse border border-slate-800 text-xs">
                        <thead>
                            <tr class="bg-slate-100 text-center">
                                <th class="border border-slate-800 p-1.5 text-left">รายการตรวจสอบ</th>
                                <th class="border border-slate-800 p-1.5 w-16">ปกติ</th>
                                <th class="border border-slate-800 p-1.5 w-16">ชำรุด</th>
                                <th class="border border-slate-800 p-1.5 w-16">ไม่มี</th>
                                <th class="border border-slate-800 p-1.5 w-48">ข้อบกพร่อง / การดำเนินการ</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            form.items.forEach((item, idx) => {
                html += `
                    <tr>
                        <td class="border border-slate-800 p-1.5">${item}</td>
                        <td class="border border-slate-800 text-center"><input type="radio" name="chk_${idx}" class="accent-slate-900 cursor-pointer"></td>
                        <td class="border border-slate-800 text-center"><input type="radio" name="chk_${idx}" class="accent-slate-900 cursor-pointer"></td>
                        <td class="border border-slate-800 text-center"><input type="radio" name="chk_${idx}" class="accent-slate-900 cursor-pointer"></td>
                        <td class="border border-slate-800 p-1"><input type="text" class="w-full border-0 outline-none text-xs"></td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>

                <!-- Section 3 & 4: Notes & Comments -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                    <div class="border border-slate-800 p-2">
                        <div class="font-bold text-slate-800 mb-1">3. สิ่งที่ต้องปรับปรุงหรือข้อมูลเพิ่มเติม :</div>
                        <textarea class="w-full h-16 border-0 focus:ring-0 resize-none outline-none text-xs"></textarea>
                    </div>
                    <div class="border border-slate-800 p-2">
                        <div class="font-bold text-slate-800 mb-1">4. การปรับปรุงข้อบกพร่อง :</div>
                        <textarea class="w-full h-16 border-0 focus:ring-0 resize-none outline-none text-xs"></textarea>
                    </div>
                </div>

                <!-- Section 5: Signatures -->
                <div class="grid grid-cols-2 gap-8 border-t-2 border-slate-800 pt-6 mt-6 text-slate-800">
                    <div class="space-y-4">
                        <div class="flex items-end gap-2"><span>ผู้ตรวจ:</span> <input type="text" class="border-b border-slate-800 border-dashed flex-1 outline-none"></div>
                        <div class="flex items-end gap-2"><span>ตำแหน่ง:</span> <input type="text" class="border-b border-slate-800 border-dashed flex-1 outline-none"></div>
                        <div class="flex items-end gap-2"><span>วันที่:</span> <input type="date" class="border-b border-slate-800 border-dashed flex-1 outline-none"></div>
                    </div>
                    <div class="space-y-4">
                        <div class="flex items-end gap-2"><span>ผู้ตรวจสอบ:</span> <input type="text" class="border-b border-slate-800 border-dashed flex-1 outline-none"></div>
                        <div class="flex items-end gap-2"><span>ตำแหน่ง:</span> <input type="text" class="border-b border-slate-800 border-dashed flex-1 outline-none"></div>
                        <div class="flex items-end gap-2"><span>วันที่:</span> <input type="date" class="border-b border-slate-800 border-dashed flex-1 outline-none"></div>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        formSelector.addEventListener('change', (e) => {
            renderForm(e.target.value);
        });

        // Load default form
        renderForm("015");
    </script>
</body>
</html>
