        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
        .app-container { width: 210mm; margin: 0 auto; box-sizing: border-box; }
        .a4-sheet {
            width: 210mm;
            min-height: 297mm;
            padding: 12mm 15mm;
            background: #ffffff;
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
            border-radius: 12px;
            position: relative;
            box-sizing: border-box;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #1e293b; padding: 3px 6px; font-size: 10px; }
        input[type="text"], input[type="date"] { border: none; outline: none; background: transparent; width: 100%; font-family: 'Sarabun', sans-serif; font-size: 10px; }
        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            .a4-sheet { box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 8mm !important; border-radius: 0 !important; border: none !important; }
        }
    </style>
</head>

        const pillsContainer = document.getElementById('pillsContainer');
        const a4Paper = document.getElementById('a4Paper');

        function loadForm(key) {
            currentFormKey = key;
            const form = formsData[key] || formsData["015"];
            a4Paper.innerHTML = form.render();

            document.querySelectorAll('.form-pill').forEach(btn => {
                if(btn.dataset.key === key) {
                    btn.className = "form-pill px-3.5 py-2.5 bg-blue-600 text-white rounded-xl font-semibold text-xs whitespace-nowrap shadow-sm cursor-pointer transition-all";
                } else {
                    btn.className = "form-pill px-3.5 py-2.5 bg-slate-50 border border-slate-200 text-slate-700 rounded-xl font-medium text-xs whitespace-nowrap hover:bg-slate-100 cursor-pointer transition-all";
                }
            });
        }

        Object.keys(formsData).forEach(key => {
            const btn = document.createElement('button');
            btn.dataset.key = key;
            btn.className = "form-pill";
            btn.innerText = formsData[key].code;
            btn.onclick = () => loadForm(key);
            pillsContainer.appendChild(btn);
        });

        function getGPSLocation(latId, longId) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(6);
                        const lon = position.coords.longitude.toFixed(6);
                        const latInput = document.getElementById(latId);
                        const longInput = document.getElementById(longId);
                        if (latInput) latInput.value = lat;
                        if (longInput) longInput.value = lon;
                        alert("ดึงพิกัด GPS สำเร็จ: " + lat + ", " + lon);
                    },
                    (error) => {
                        alert("ไม่สามารถดึงพิกัดได้: กรุณาอนุญาตการเข้าถึงตำแหน่ง (GPS)");
                    }
                );
            } else {
                alert("เบราว์เซอร์ของคุณไม่รองรับการระบุตำแหน่ง GPS");
            }
        }
