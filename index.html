            "025": {

                code: "SF-07-0-025",
                generalHTML: `
                    <tr><td class="border p-1.5 bg-gray-50 w-28">Station ID</td><td class="border p-1.5"><input type="text" class="w-full border-0"></td><td class="border p-1.5 bg-gray-50 w-28">สถานที่</td><td class="border p-1.5"><input type="text" class="w-full border-0"></td></tr>
                    <tr><td class="border p-1.5 bg-gray-50">อุปกรณ์ / สายป้อน</td><td class="border p-1.5"><input type="text" class="w-full border-0"></td><td class="border p-1.5 bg-gray-50">MEA No.</td><td class="border p-1.5"><input type="text" class="w-full border-0"></td></tr>

        formSelector.addEventListener('change', (e) => {
            const val = e.target.value;

            let html = `
                <div class="text-center font-bold text-sm border-b pb-3 mb-4">${currentForm.title} (${currentForm.code})</div>

            });

            html += `

            container.innerHTML = html;
        });

        formSelector.dispatchEvent(new Event('change'));
    </script>
</body>
