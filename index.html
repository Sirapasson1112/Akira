<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบใบตรวจสอบอุปกรณ์ไฟฟ้า</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #faf8f5; color: #4a3b32; }
        .app-container { width: 210mm; margin: 0 auto; box-sizing: border-box; }
        .a4-sheet {
            width: 210mm;
            min-height: 297mm;
            padding: 12mm 15mm;
            background: #ffffff;
            box-shadow: 0 15px 30px -5px rgba(210, 180, 140, 0.15), 0 5px 15px -5px rgba(210, 180, 140, 0.08);
            border-radius: 16px;
            position: relative;
            box-sizing: border-box;
            border: 1px solid #e3d3b8;
        }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #c8b18d; padding: 3px 6px; font-size: 10px; color: #4a3b32; }
        input[type="text"], input[type="date"] { border: none; outline: none; background: transparent; width: 100%; font-family: 'Sarabun', sans-serif; font-size: 10px; color: #5c4033; }
        textarea { color: #5c4033; }
        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            .a4-sheet { box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 8mm !important; border-radius: 0 !important; border: none !important; }
        }
    </style>
</head>
<body class="pb-16">

    <!-- Header -->
    <header class="no-print bg-white/90 backdrop-blur-md border-b border-[#e3d3b8] sticky top-0 z-50 shadow-xs">
        <div class="app-container px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-[#D2B48C] to-[#bfa074] flex items-center justify-center text-white shadow-md shadow-[#D2B48C]/30 font-bold text-xs">⚡</div>
                <div>
                    <h1 class="text-xs font-bold text-[#5c4033]">ระบบใบตรวจสอบอุปกรณ์ไฟฟ้า</h1>
                    <p class="text-[10px] text-[#9c7d5b]">Digital Inspection Workspace</p>
                </div>
            </div>
            <button onclick="handleGoogleLogin()" id="loginBtn" class="flex items-center gap-2 px-3.5 py-2 border border-[#d8c3a2] rounded-xl text-xs font-medium hover:bg-[#fcf8f2] transition bg-white text-[#5c4033] cursor-pointer shadow-2xs">
                <span id="loginText">Google Account</span>
            </button>
        </div>
    </header>

    <main class="no-print app-container px-4 mt-6 text-xs space-y-4">
        <!-- Action Toolbar -->
        <div class="bg-white p-4 rounded-2xl border border-[#e3d3b8] shadow-sm flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
                <span id="statusBadge" class="inline-flex items-center gap-1.5 px-3 py-1 bg-[#fefae0] text-[#705335] rounded-lg text-xs font-medium border border-[#d8c3a2]">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#D2B48C] animate-pulse"></span> พร้อมทำงาน
                </span>
                <button onclick="saveNewRecord()" class="px-3.5 py-2 bg-[#bfa074] hover:bg-[#a88a5f] text-white rounded-xl font-medium transition cursor-pointer shadow-sm shadow-[#D2B48C]/30">บันทึกรายการใหม่</button>
                <button onclick="saveCurrentRecord()" class="px-3.5 py-2 bg-[#fcf8f2] hover:bg-[#f5ecdc] text-[#5c4033] rounded-xl font-medium transition cursor-pointer border border-[#d8c3a2]">บันทึกปัจจุบัน</button>
                <button onclick="copyNewDraft()" class="px-3.5 py-2 bg-[#fcf8f2] hover:bg-[#f5ecdc] text-[#5c4033] rounded-xl font-medium transition cursor-pointer border border-[#d8c3a2]">คัดลอกฉบับใหม่</button>
                <button onclick="createNewForm()" class="px-3.5 py-2 hover:bg-[#fcf8f2] text-[#705335] rounded-xl font-medium transition cursor-pointer">ฟอร์มใหม่</button>
                <button onclick="clearFormInputs()" class="px-3.5 py-2 hover:bg-[#fcf8f2] text-[#705335] rounded-xl font-medium transition cursor-pointer">ล้าง</button>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="window.print()" class="px-4 py-2 bg-[#5c4033] text-white rounded-xl font-medium hover:bg-[#4a3b32] transition cursor-pointer shadow-sm">🖨️ พิมพ์ / PDF</button>
                <button onclick="exportCSV()" class="px-4 py-2 bg-white border border-[#d8c3a2] text-[#5c4033] rounded-xl font-medium hover:bg-[#fcf8f2] transition cursor-pointer">📥 CSV</button>
            </div>
        </div>

        <!-- Form Selection Grid -->
        <div class="bg-white p-4 rounded-2xl border border-[#e3d3b8] shadow-sm">
            <div class="text-[#5c4033] font-bold mb-3 text-xs flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-[#D2B48C]"></span> เลือกแบบฟอร์มใบงานตรวจสอบอุปกรณ์ไฟฟ้า (ครบถ้วนทั้ง 11 แบบฟอร์ม)
            </div>
            <div id="pillsContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2"></div>
        </div>
    </main>

        <div id="zoomContainer" class="transition-transform duration-200 origin-top">
            <div id="a4Paper" class="a4-sheet text-[#4a3b32]"></div>
        </div>
    </div>

        const pillsContainer = document.getElementById('pillsContainer');
        const a4Paper = document.getElementById('a4Paper');

        function loadForm(key) {
            currentFormKey = key;
            const form = formsData[key] || formsData["015"];
            a4Paper.innerHTML = form.render();

            document.querySelectorAll('.form-pill').forEach(btn => {
                if(btn.dataset.key === key) {
                    btn.className = "form-pill px-3.5 py-2.5 bg-[#D2B48C] text-white rounded-xl font-semibold text-xs whitespace-nowrap shadow-sm cursor-pointer transition-all shadow-[#D2B48C]/30";
                } else {
                    btn.className = "form-pill px-3.5 py-2.5 bg-[#fcf8f2] border border-[#d8c3a2] text-[#5c4033] rounded-xl font-medium text-xs whitespace-nowrap hover:bg-[#f5ecdc] cursor-pointer transition-all";
                }
            });
        }

        Object.keys(formsData).forEach(key => {
            if(key === '019_2') return;
            const btn = document.createElement('button');
            btn.dataset.key = key;
            btn.className = "form-pill";
            btn.innerText = formsData[key].code;
            btn.onclick = () => loadForm(key);
            pillsContainer.appendChild(btn);
        });

        function getGPSLocation(latId, longId) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(6);
                        const lon = position.coords.longitude.toFixed(6);
                        const latInput = document.getElementById(latId);
                        const longInput = document.getElementById(longId);
                        if (latInput) latInput.value = lat;
                        if (longInput) longInput.value = lon;
                        alert("ดึงพิกัด GPS สำเร็จ: " + lat + ", " + lon);
                    },
                    (error) => {
                        alert("ไม่สามารถดึงพิกัดได้: กรุณาอนุญาตการเข้าถึงตำแหน่ง (GPS)");
                    }
                );
            } else {
                alert("เบราว์เซอร์ของคุณไม่รองรับการระบุตำแหน่ง GPS");
            }
        }

        function handleGoogleLogin() { alert("เชื่อมต่อบัญชี Google สำเร็จ"); }
        function saveNewRecord() { alert("บันทึกรายการใหม่สำเร็จ"); }
        function saveCurrentRecord() { alert("บันทึกปัจจุบันสำเร็จ"); }
        function copyNewDraft() { alert("คัดลอกฉบับใหม่สำเร็จ"); }
        function createNewForm() { alert("สร้างฟอร์มใหม่"); }
        function clearFormInputs() { loadForm(currentFormKey); alert("ล้างฟอร์มสำเร็จ"); }
        function exportCSV() { alert("ดาวน์โหลด CSV สำเร็จ"); }

        loadForm("015");
    </script>
