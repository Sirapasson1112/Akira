                    "2. กรองน้ำมันครั้งที่ 1 และทดสอบซ้ำ[cite: 9]",
                    "3. กรองน้ำมันครั้งที่ 2 และทดสอบซ้ำ[cite: 9]"
                ]
            },
            "024": {
                title: "รายงานผลการตรวจสอบจุดร้อนแดง (Hot Spot)",
                code: "SF-07-0-024",
                general: `<tr><td class="border border-slate-300 p-1.5 bg-slate-50 w-28 font-medium">Station ID</td><td class="border border-slate-300 p-1.5"><input type="text" class="w-full border-0 outline-none"></td><td class="border border-slate-300 p-1.5 bg-slate-50 w-28 font-medium">สถานที่</td><td class="border border-slate-300 p-1.5"><input type="text" class="w-full border-0 outline-none"></td></tr>`,
                items: [
                    "ตรวจสอบอุณหภูมิสูงสุดที่จุดวัดฯ (Delta T)[cite: 10]",
                    "ประเมินลำดับความสำคัญ (Criticality)[cite: 10]"
                ]
            },
            "025": {
                title: "รายงานผลการตรวจสอบการคายประจุไฟฟ้า (Partial Discharge)",
                code: "SF-07-0-025",
                general: `<tr><td class="border border-slate-300 p-1.5 bg-slate-50 w-28 font-medium">Station ID</td><td class="border border-slate-300 p-1.5"><input type="text" class="w-full border-0 outline-none"></td><td class="border border-slate-300 p-1.5 bg-slate-50 w-28 font-medium">สถานที่</td><td class="border border-slate-300 p-1.5"><input type="text" class="w-full border-0 outline-none"></td></tr>`,
                items: [
                    "ตรวจสอบจุดผิดปกติด้วย Acoustic Camera[cite: 11]",
                    "ประเมินระดับความเข้มเสียงและระดับความรุนแรง[cite: 11]"
                ]
            }
        };

        const container = document.getElementById('formContainer');
        const pillsContainer = document.getElementById('pillsContainer');

        function renderForm(key) {
            const form = formsContent[key];
            
            document.querySelectorAll('.pill-btn').forEach(btn => {
                if(btn.dataset.key === key) {
                    btn.className = "pill-btn px-4 py-1.5 bg-blue-600 text-white rounded-xl font-semibold whitespace-nowrap shadow-sm cursor-pointer transition transform active:scale-95";
                } else {
                    btn.className = "pill-btn px-4 py-1.5 bg-white border border-slate-200 text-slate-600 rounded-xl font-medium whitespace-nowrap hover:bg-slate-50 hover:border-slate-300 shadow-2xs cursor-pointer transition transform active:scale-95";
                }
            });

            let html = `
                <div class="bg-slate-900 text-white text-center py-2.5 font-bold text-sm rounded-lg shadow-xs">
                    ${form.title} (${form.code})
                </div>
                <div>
                    <div class="bg-slate-200 text-slate-700 px-2.5 py-1 font-bold text-xs rounded mb-2">1. ข้อมูลทั่วไป</div>
                    <table class="w-full border-collapse border border-slate-300 text-left">
                        ${form.general}
                    </table>
                </div>
                <div>
                    <div class="bg-slate-200 text-slate-700 px-2.5 py-1 font-bold text-xs rounded mb-2">2. รายการตรวจสอบบำรุงรักษา</div>
                    <table class="w-full border-collapse border border-slate-300 text-left">
                        <thead>
                            <tr class="bg-slate-100 text-center">
                                <th class="border border-slate-300 p-2 text-left font-semibold text-slate-700">รายการ</th>
                                <th class="border border-slate-300 p-2 w-16 font-semibold text-slate-700">ปกติ</th>
                                <th class="border border-slate-300 p-2 w-16 font-semibold text-slate-700">ชำรุด</th>
                                <th class="border border-slate-300 p-2 w-16 font-semibold text-slate-700">ไม่มี</th>
                                <th class="border border-slate-300 p-2 w-48 font-semibold text-slate-700">ข้อบกพร่อง</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            form.items.forEach((item, idx) => {
                html += `
                    <tr class="hover:bg-slate-50/50 transition">
                        <td class="border border-slate-300 p-2">${item}</td>
                        <td class="border border-slate-300 text-center"><input type="radio" name="chk_${idx}" class="w-4 h-4 text-blue-600 accent-blue-600 cursor-pointer"></td>
                        <td class="border border-slate-300 text-center"><input type="radio" name="chk_${idx}" class="w-4 h-4 text-orange-600 accent-orange-600 cursor-pointer"></td>
                        <td class="border border-slate-300 text-center"><input type="radio" name="chk_${idx}" class="w-4 h-4 text-slate-500 accent-slate-500 cursor-pointer"></td>
                        <td class="border border-slate-300 p-1"><input type="text" class="w-full border-0 outline-none text-xs p-1" placeholder="ระบุ..."></td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4">
                    <div class="border border-slate-300 rounded-xl p-3 bg-slate-50/30">
                        <div class="font-bold mb-1.5 text-slate-700">4. สิ่งที่ต้องปรับปรุงหรือข้อมูลเพิ่มเติม :</div>
                        <textarea class="w-full h-16 border border-slate-200 rounded-lg p-2 resize-none outline-none text-xs bg-white focus:ring-1 focus:ring-blue-500"></textarea>
                    </div>
                    <div class="border border-slate-300 rounded-xl p-3 bg-slate-50/30">
                        <div class="font-bold mb-1.5 text-slate-700">5. การปรับปรุงข้อบกพร่อง :</div>
                        <textarea class="w-full h-16 border border-slate-200 rounded-lg p-2 resize-none outline-none text-xs bg-white focus:ring-1 focus:ring-blue-500"></textarea>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        Object.keys(formsContent).forEach(key => {
            const form = formsContent[key];
            const btn = document.createElement('button');
            btn.dataset.key = key;
            btn.innerText = `${form.code}`;
            btn.onclick = () => renderForm(key);
            pillsContainer.appendChild(btn);
        });

        renderForm("015");
    </script>
</body>
</html>
