<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM Field Inspection System - A4 Original Exact Layout</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #fdfbf7; }
        .a4-sheet {
            width: 210mm;
            min-height: 297mm;
            padding: 12mm 15mm;
            margin: 0 auto;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            box-sizing: border-box;
        }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #1e293b; padding: 3px 6px; font-size: 11px; }
        input[type="text"], input[type="date"] { border: none; outline: none; background: transparent; width: 100%; font-family: 'Sarabun', sans-serif; font-size: 11px; }
        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            .a4-sheet { box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 8mm !important; }
        }
    </style>
</head>
<body class="pb-16 text-slate-800">

    <!-- Top Branding & Login Bar -->
    <header class="no-print bg-[#f4efe6] border-b border-[#e6decb] sticky top-0 z-50 shadow-xs">
        <div class="max-w-5xl mx-auto px-4 py-2 flex flex-col items-center gap-2">
            <div class="w-full flex flex-wrap justify-between items-center gap-2 bg-white p-2.5 rounded-xl border border-[#d8cdbc] shadow-2xs">
                <span class="text-amber-700 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-lg text-xs font-medium">
                    ยังไม่ได้เข้าสู่ระบบ – ข้อมูลจะไม่ถูกบันทึก
                </span>
                <button onclick="alert('จำลองการเข้าสู่ระบบด้วย Google สำเร็จ')" class="flex items-center gap-1.5 px-3 py-1.5 border border-[#d8cdbc] rounded-xl text-xs font-medium hover:bg-slate-50 transition bg-white shadow-2xs cursor-pointer">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                    เข้าสู่ระบบด้วย Google
                </button>
            </div>
        </div>
    </header>

    <main class="no-print max-w-5xl mx-auto px-4 mt-4 text-xs space-y-3">
        
        <!-- Action Toolbar Panel -->
        <div class="bg-white p-3 rounded-xl border border-[#d8cdbc] shadow-xs flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-slate-500 font-medium px-1">พร้อมใช้งาน</span>
                <button class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition shadow-xs cursor-pointer">บันทึกเป็นรายการใหม่</button>
                <button class="px-3 py-1.5 bg-slate-100 border border-slate-200 text-slate-700 rounded-lg font-medium hover:bg-slate-200 transition cursor-pointer">บันทึกกับรายการปัจจุบัน</button>
                <button class="px-3 py-1.5 bg-slate-100 border border-slate-200 text-slate-700 rounded-lg font-medium hover:bg-slate-200 transition cursor-pointer">คัดลอกเป็นฉบับใหม่</button>
                <button class="px-3 py-1.5 border border-slate-200 text-slate-700 rounded-lg font-medium hover:bg-slate-50 transition cursor-pointer">ฟอร์มใหม่</button>
                <button class="px-3 py-1.5 border border-slate-200 text-slate-700 rounded-lg font-medium hover:bg-slate-50 transition cursor-pointer">ล้างฟอร์ม</button>
            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="window.print()" class="px-3 py-1.5 border border-slate-200 text-slate-700 rounded-lg font-medium hover:bg-slate-50 transition cursor-pointer flex items-center gap-1">🖨️ พิมพ์ / PDF</button>
                <button onclick="alert('ดาวน์โหลดไฟล์ CSV สำเร็จ')" class="px-3 py-1.5 border border-slate-200 text-slate-700 rounded-lg font-medium hover:bg-slate-50 transition cursor-pointer flex items-center gap-1">📥 ดาวน์โหลด CSV</button>
            </div>
        </div>

        <!-- Form Code Quick Buttons Container (Pills) -->
        <div class="bg-white p-3 rounded-xl border border-[#d8cdbc] shadow-xs">
            <div id="pillsContainer" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Saved Data Search Bar Panel -->
        <div class="bg-white p-3 rounded-xl border border-[#d8cdbc] shadow-xs">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                <span class="font-bold text-slate-700">📁 ข้อมูลที่บันทึกไว้ (0)</span>
                <div class="flex items-center gap-1.5">
                    <button class="px-2.5 py-1 border border-slate-200 rounded-lg hover:bg-slate-50 transition text-slate-600">🔄 รีเฟรช</button>
                    <button class="px-2.5 py-1 border border-slate-200 rounded-lg hover:bg-slate-50 transition text-slate-600">ล้าง</button>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 mb-2">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-2.5 text-slate-400">🔍</span>
                    <input type="text" placeholder="Plant" class="w-full border border-slate-300 rounded-lg pl-8 pr-3 py-1.5 bg-slate-50/50 outline-none focus:ring-1 focus:ring-blue-500">
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-2.5 text-slate-400">🔍</span>
                    <input type="text" placeholder="Work Order" class="w-full border border-slate-300 rounded-lg pl-8 pr-3 py-1.5 bg-slate-50/50 outline-none focus:ring-1 focus:ring-blue-500">

            </div>
            <div class="text-center py-4 text-slate-400 border border-dashed border-slate-200 rounded-lg bg-slate-50/30">
                เข้าสู่ระบบเพื่อดูรายการที่บันทึกไว้
            </div>
        </div>

        <!-- Photo Inspection Section -->
        <div class="bg-white p-3 rounded-xl border border-[#d8cdbc] shadow-xs">
            <div class="flex justify-between items-center mb-2">
                <span class="font-bold text-slate-700 flex items-center gap-1">📷 รูปภาพประกอบการตรวจสอบ</span>
                <div class="flex items-center gap-2">
                    <button class="px-3 py-1 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition shadow-2xs cursor-pointer">+ เพิ่มรูป</button>

                </div>
            </div>
            <div class="border border-dashed border-slate-300 rounded-lg p-3 text-center text-slate-400 bg-slate-50/50">

            </div>
        </div>

        <!-- Criticality Evaluation Section -->
        <div class="bg-white p-3 rounded-xl border border-[#d8cdbc] shadow-xs mb-6">
            <div class="flex justify-between items-center mb-2">
                <span class="font-bold text-amber-800 flex items-center gap-1">⚠️ การประเมินความสำคัญของอุปกรณ์ (Criticality)</span>
                <span class="text-slate-500 font-medium bg-slate-100 px-2.5 py-0.5 rounded-full text-[11px]">ยังไม่ประเมิน</span>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-5 gap-2 mb-2">
                <div>
                    <label class="block text-slate-500 mb-1">SAF – ความปลอดภัย</label>
                    <select class="w-full border border-slate-300 rounded-lg p-1.5 bg-white outline-none"><option>- เลือก -</option></select>
                </div>
                <div>
                    <label class="block text-slate-500 mb-1">REL – ความต่อเนื่องจ่ายไฟ</label>
                    <select class="w-full border border-slate-300 rounded-lg p-1.5 bg-white outline-none"><option>- เลือก -</option></select>
                </div>
                <div>
                    <label class="block text-slate-500 mb-1">OPR – การปฏิบัติงาน/ภารกิจ</label>
                    <select class="w-full border border-slate-300 rounded-lg p-1.5 bg-white outline-none"><option>- เลือก -</option></select>
                </div>
                <div>
                    <label class="block text-slate-500 mb-1">CON – สภาพอุปกรณ์</label>
                    <select class="w-full border border-slate-300 rounded-lg p-1.5 bg-white outline-none"><option>- เลือก -</option></select>
                </div>
                <div>
                    <label class="block text-slate-500 mb-1">REC – ความยากในการกู้คืน</label>
                    <select class="w-full border border-slate-300 rounded-lg p-1.5 bg-white outline-none"><option>- เลือก -</option></select>
                </div>
            </div>
            <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border border-slate-200 mt-2">
                <span class="font-bold text-slate-700">คะแนนรวม: - / 100</span>
            </div>
        </div>

    </main>

    <!-- A4 Document Workspace -->
    <div class="max-w-7xl mx-auto px-4 mt-6 overflow-x-auto flex justify-center">
        <div id="zoomContainer" class="transition-transform duration-200 origin-top">
            <div id="a4Paper" class="a4-sheet text-slate-900"></div>
        </div>
