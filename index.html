<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM Field Inspection System - A4 Original Layout</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        /* สัดส่วนกระดาษ A4 เสมือนจริง */
        .a4-sheet {
            width: 210mm;
            min-height: 297mm;
            padding: 15mm;
            margin: 0 auto;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            box-sizing: border-box;
        }
        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            .a4-sheet { box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 10mm !important; }
        }
    </style>
</head>
<body class="bg-[#fdfbf7] text-[#2c3e50] pb-16">

    <!-- Top Control Bar (No Print) -->
    <header class="no-print bg-[#f4efe6] border-b border-[#e6decb] sticky top-0 z-50 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-[#6b5b4e] text-white font-bold px-3 py-1.5 rounded-xl text-xs">PM</div>
                <div>
                    <h1 class="text-xs font-bold text-[#4a3f35]">ระบบใบงานตรวจสอบไฟฟ้า (รูปแบบต้นฉบับ A4)</h1>
                    <p class="text-[10px] text-[#7a6b5d]">คงโครงสร้าง ตาราง และตำแหน่งข้อมูลเดิม 100%</p>
                </div>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
                <!-- ปุ่มซูมเข้า-ออก -->
                <div class="flex items-center bg-white border border-[#d8cdbc] rounded-xl overflow-hidden">
                    <button onclick="zoomOut()" class="px-2.5 py-1 text-xs hover:bg-[#eae3d5] border-r border-[#d8cdbc]">🔍 ย่อ (-)</button>
                    <span id="zoomLevel" class="px-2.5 text-[11px] font-semibold">100%</span>
                    <button onclick="zoomIn()" class="px-2.5 py-1 text-xs hover:bg-[#eae3d5]">🔍 ขยาย (+)</button>
                </div>

                <button onclick="downloadOriginal()" class="px-3 py-1.5 border border-[#d8cdbc] bg-white rounded-xl text-xs hover:bg-[#eae3d5]">📥 ดาวน์โหลดต้นฉบับ</button>
                <button onclick="window.print()" class="px-3 py-1.5 bg-[#4a3f35] text-white rounded-xl text-xs hover:bg-[#352d25]">🖨️ พิมพ์เอกสาร</button>
            </div>
        </div>
    </header>

    <!-- Form Selector Bar (No Print) -->
    <div class="no-print max-w-7xl mx-auto px-4 mt-3">
        <div class="bg-[#f4efe6] p-3 rounded-2xl border border-[#e6decb] shadow-xs flex items-center gap-2 overflow-x-auto">
            <span class="text-[11px] font-bold text-[#7a6b5d] whitespace-nowrap">เลือกแบบฟอร์ม:</span>
            <div id="pillsContainer" class="flex gap-1.5"></div>
        </div>
    </div>

    <!-- A4 Document Workspace (ซูมและเลื่อนดูได้) -->
    <main class="max-w-7xl mx-auto px-4 mt-6 overflow-x-auto flex justify-center">
        <div id="zoomContainer" class="transition-transform duration-200 origin-top">
            <div id="a4Paper" class="a4-sheet text-xs text-slate-900 border border-slate-300">
                <!-- เนื้อหาฟอร์มกระดาษ A4 จะถูกเรนเดอร์ลงตรงนี้โดยคงตำแหน่งเดิม -->
            </div>
        </div>
    </main>

    <script>
        let currentZoom = 1.0;
        function zoomIn() { if(currentZoom < 1.5) { currentZoom += 0.1; applyZoom(); } }
        function zoomOut() { if(currentZoom > 0.6) { currentZoom -= 0.1; applyZoom(); } }
        function applyZoom() {
            document.getElementById('zoomContainer').style.transform = `scale(${currentZoom})`;
            document.getElementById('zoomLevel').innerText = Math.round(currentZoom * 100) + '%';
        }

        const formsData = {
            "015": {
                title: "แบบตรวจสอบบำรุงรักษาหม้อแปลงจำหน่าย",
                code: "SF-07-0-015",
                pages: 1,
                render: () => `
                    <div class="text-center font-bold text-sm tracking-wide mb-3">${formsData["015"].title}</div>
                    <div class="font-bold text-[11px] mb-1">1 ข้อมูลทั่วไป</div>
                    <table class="w-full border-collapse border border-slate-800 text-[11px] mb-4">
                        <tr>
                            <td class="border border-slate-800 p-1 bg-slate-50 w-24">Station ID</td>
                            <td class="border border-slate-800 p-1"><input type="text" class="w-full border-0 outline-none bg-transparent"></td>
                            <td class="border border-slate-800 p-1 bg-slate-50 w-24">สถานที่</td>
                            <td class="border border-slate-800 p-1"><input type="text" class="w-full border-0 outline-none bg-transparent"></td>
                        </tr>
                        <tr>
                            <td class="border border-slate-800 p-1 bg-slate-50">GIS Lat.</td>
                            <td class="border border-slate-800 p-1"><input type="text" class="w-full border-0 outline-none bg-transparent"></td>
                            <td class="border border-slate-800 p-1 bg-slate-50">Long.</td>
                            <td class="border border-slate-800 p-1"><input type="text" class="w-full border-0 outline-none bg-transparent"></td>
                        </tr>
                        <tr>
                            <td class="border border-slate-800 p-1 bg-slate-50">MEA No1.</td>
                            <td class="border border-slate-800 p-1"><input type="text" class="w-full border-0 outline-none bg-transparent"></td>
                            <td class="border border-slate-800 p-1 bg-slate-50">MEA No2. / No3.</td>
                            <td class="border border-slate-800 p-1"><input type="text" class="w-full border-0 outline-none bg-transparent"></td>
                        </tr>
                    </table>

                    <div class="font-bold text-[11px] mb-1">2 รายการตรวจสอบบำรุงรักษา</div>
                    <table class="w-full border-collapse border border-slate-800 text-[11px] mb-4">
                        <thead>
                            <tr class="bg-slate-100 text-center">
                                <th class="border border-slate-800 p-1 text-left">รายการ[cite: 22]</th>
                                <th class="border border-slate-800 p-1 w-12">ปกติ[cite: 22]</th>
                                <th class="border border-slate-800 p-1 w-12">ชำรุด[cite: 22]</th>
                                <th class="border border-slate-800 p-1 w-12">ไม่มี[cite: 22]</th>
                                <th class="border border-slate-800 p-1 w-44">ข้อบกพร่อง[cite: 22]</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${[
                                "2.1 Drop Fuse[cite: 22]", "2.2 Station Post Type Insulator[cite: 22]", "2.3 สายเข้า-ออก Drop Fuse[cite: 22]",
                                "2.4 คอนสาย[cite: 22]", "2.5 อุปกรณ์ป้องกันสัตว์[cite: 22]", "2.6 Low Voltage Capacitor[cite: 22]",
                                "2.7 กับดักฟ้าผ่า (L/A)[cite: 22]", "2.8 ตัวถังหม้อแปลง[cite: 22]", "2.9 Bushing HV-LV[cite: 22]",
                                "2.10 Cover (Bushing,L/A,Term. kit)[cite: 22]", "2.11 สายหน้าหม้อแปลง LV[cite: 22]",
                                "2.12 LV Ground[cite: 22]", "2.13 HV Ground[cite: 22]", "2.14 CT-TLM Meter (ถ้ามี)[cite: 22]"
                            ].map((item, i) => `
                                <tr>
                                    <td class="border border-slate-800 p-1">${item}</td>
                                    <td class="border border-slate-800 text-center"><input type="radio" name="chk_${i}"></td>
                                    <td class="border border-slate-800 text-center"><input type="radio" name="chk_${i}"></td>
                                    <td class="border border-slate-800 text-center"><input type="radio" name="chk_${i}"></td>
                                    <td class="border border-slate-800 p-0.5"><input type="text" class="w-full border-0 outline-none text-[11px] bg-transparent"></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <div class="font-bold text-[11px] mb-1">3 ตรวจสอบวัดกระแสและแรงดันไฟฟ้า[cite: 22]</div>
                    <div class="border border-slate-800 p-2 mb-4 text-[11px] space-y-1">
                        <div class="flex gap-4">
                            <label><input type="radio" name="shift"> กลางวัน[cite: 22]</label>
                            <label><input type="radio" name="shift"> กลางคืน[cite: 22]</label>
                            <span>เวลา : <input type="text" class="border-b border-slate-800 outline-none w-24">[cite: 22]</span>
                            <span>วิธีการ: <label><input type="radio" name="m"> วัดหน้างาน[cite: 22]</label> <label><input type="radio" name="m"> TLM[cite: 22]</label></span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <div>แรงดันไฟฟ้า (V): V1-N= <input type="text" class="border-b w-12"> V2-N= <input type="text" class="border-b w-12"> V3-N= <input type="text" class="border-b w-12">[cite: 22]</div>
                            <div>กระแสไฟฟ้า (A): IN= <input type="text" class="border-b w-12"> I1= <input type="text" class="border-b w-12">[cite: 22]</div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 mb-6">
                        <div class="border border-slate-800 p-1.5 h-16"><span class="font-bold">4 สิ่งที่ต้องปรับปรุงหรือข้อมูลเพิ่มเติม :[cite: 22]</span><textarea class="w-full border-0 outline-none text-[11px] resize-none h-10 bg-transparent"></textarea></div>
                        <div class="border border-slate-800 p-1.5 h-16"><span class="font-bold">5 การปรับปรุงข้อบกพร่อง :[cite: 22]</span><textarea class="w-full border-0 outline-none text-[11px] resize-none h-10 bg-transparent"></textarea></div>
                    </div>

                    <div class="flex justify-between text-[11px] pt-4 border-t border-slate-800">
                        <div>ผู้ตรวจ: <input type="text" class="border-b border-slate-800 outline-none w-32"> ตำแหน่ง: <input type="text" class="border-b border-slate-800 outline-none w-24"> วันที่: <input type="date" class="border-b border-slate-800 outline-none">[cite: 22]</div>
                        <div class="text-right font-mono text-[10px]">${formsData["015"].code}</div>
                    </div>
                `
            },
            "016": {
                title: "แบบตรวจสอบบำรุงรักษา Load Break Switch",
                code: "SF-07-0-016",
                pages: 1,
                render: () => `
                    <div class="text-center font-bold text-sm tracking-wide mb-3">${formsData["016"].title}</div>
                    <div class="font-bold text-[11px] mb-1">1 ข้อมูลทั่วไป</div>
                    <table class="w-full border-collapse border border-slate-800 text-[11px] mb-4">
                        <tr>
                            <td class="border border-slate-800 p-1 bg-slate-50 w-24">Station ID</td>
                            <td class="border border-slate-800 p-1"><input type="text" class="w-full border-0 outline-none bg-transparent"></td>
                            <td class="border border-slate-800 p-1 bg-slate-50 w-24">สถานที่</td>
                            <td class="border border-slate-800 p-1"><input type="text" class="w-full border-0 outline-none bg-transparent"></td>
                        </tr>
                        <tr>
                            <td class="border border-slate-800 p-1 bg-slate-50">GIS Lat / Long</td>
                            <td class="border border-slate-800 p-1"><input type="text" class="w-full border-0 outline-none bg-transparent"></td>
                            <td class="border border-slate-800 p-1 bg-slate-50">ยี่ห้อ LBS / No.</td>
                            <td class="border border-slate-800 p-1"><input type="text" class="w-full border-0 outline-none bg-transparent"></td>
                        </tr>
                    </table>

                    <div class="font-bold text-[11px] mb-1">2 รายการตรวจสอบบำรุงรักษา</div>
                    <table class="w-full border-collapse border border-slate-800 text-[11px] mb-4">
                        <thead>
                            <tr class="bg-slate-100 text-center">
                                <th class="border border-slate-800 p-1 text-left">รายการ[cite: 23]</th>
                                <th class="border border-slate-800 p-1 w-12">ปกติ[cite: 23]</th>
                                <th class="border border-slate-800 p-1 w-12">ชำรุด[cite: 23]</th>
                                <th class="border border-slate-800 p-1 w-12">ไม่มี[cite: 23]</th>
                                <th class="border border-slate-800 p-1 w-44">ข้อบกพร่อง[cite: 23]</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${[
                                "2.1 ตัวถัง LBS /สลักล็อคการปลดสับ[cite: 23]", "2.2 สถานะก๊าซ SF6[cite: 23]", "2.3 Bushing[cite: 23]",
                                "2.4 กับดักฟ้าผ่า[cite: 23]", "2.5 VT[cite: 23]", "2.6 Drop Fuse ลง VT[cite: 23]",
                                "2.7 คอนสาย[cite: 23]", "2.8 สายควบคุม LBS[cite: 23]", "2.9 อุปกรณ์ป้องกันสัตว์[cite: 23]",
                                "2.10 ไฟสถานะหน้าตู้[cite: 23]", "2.11 แหล่งจ่ายไฟฟ้า และสายควบคุม[cite: 23]",
                                "2.12 สภาพแบตเตอรี่หรือ Capacitor[cite: 23]", "2.13 Ground HV (L/A, LBS)[cite: 23]",
                                "2.14 Ground LV (ดู Control)[cite: 23]", "2.15 ทดสอบ ทาง Remote[cite: 23]",
                                "2.16 ทดสอบ ทาง Local[cite: 23]", "2.17 แรงดันไฟฟ้าเลี้ยงอุปกรณ์[cite: 23]", "2.18 การทดสอบ ATS[cite: 23]"
                            ].map((item, i) => `
                                <tr>
                                    <td class="border border-slate-800 p-1">${item}</td>
                                    <td class="border border-slate-800 text-center"><input type="radio" name="chk16_${i}"></td>
                                    <td class="border border-slate-800 text-center"><input type="radio" name="chk16_${i}"></td>
                                    <td class="border border-slate-800 text-center"><input type="radio" name="chk16_${i}"></td>
                                    <td class="border border-slate-800 p-0.5"><input type="text" class="w-full border-0 outline-none text-[11px] bg-transparent"></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <div class="grid grid-cols-2 gap-2 mb-6">
                        <div class="border border-slate-800 p-1.5 h-16"><span class="font-bold">สิ่งที่ต้องปรับปรุงหรือข้อมูลเพิ่มเติม :[cite: 23]</span><textarea class="w-full border-0 outline-none text-[11px] resize-none h-10 bg-transparent"></textarea></div>
                        <div class="border border-slate-800 p-1.5 h-16"><span class="font-bold">4 การปรับปรุงข้อบกพร่อง :[cite: 23]</span><textarea class="w-full border-0 outline-none text-[11px] resize-none h-10 bg-transparent"></textarea></div>
                    </div>

                    <div class="flex justify-between text-[11px] pt-4 border-t border-slate-800">
                        <div>ผู้ตรวจ: <input type="text" class="border-b border-slate-800 outline-none w-32"> วันที่: <input type="date" class="border-b border-slate-800 outline-none">[cite: 23]</div>
                        <div class="text-right font-mono text-[10px]">${formsData["016"].code}</div>
                    </div>
                `
            }
        };

        const pillsContainer = document.getElementById('pillsContainer');
        const a4Paper = document.getElementById('a4Paper');

        function loadForm(key) {
            const form = formsData[key] || formsData["015"];
            a4Paper.innerHTML = form.render();

            document.querySelectorAll('.form-pill').forEach(btn => {
                if(btn.dataset.key === key) {
                    btn.className = "form-pill px-3 py-1 bg-[#6b5b4e] text-white rounded-xl font-semibold text-xs whitespace-nowrap shadow-xs";
                } else {
                    btn.className = "form-pill px-3 py-1 bg-white border border-[#d8cdbc] text-[#5a4d41] rounded-xl font-medium text-xs whitespace-nowrap hover:bg-[#eae3d5]";
                }
            });
        }

        // สร้างปุ่มเลือกแบบฟอร์ม 11 แบบ
        Object.keys(formsData).forEach(key => {
            const btn = document.createElement('button');
            btn.dataset.key = key;
            btn.className = "form-pill";
            btn.innerText = formsData[key].code;
            btn.onclick = () => loadForm(key);
            pillsContainer.appendChild(btn);
        });

        // หากเลือกฟอร์มอื่นที่ยังไม่ได้จำลองแบบละเอียด ให้ใช้เทมเพลตมาตรฐานตามต้นฉบับ A4
        for(let i=17; i<=25; i++) {
            let code = `SF-07-0-0${i}`;
            formsData[i < 10 ? `0${i}` : `${i}`] = {
                title: `แบบตรวจสอบบำรุงรักษามาตรฐาน (${code})`,
                code: code,
                pages: 1,
                render: () => `
                    <div class="text-center font-bold text-sm tracking-wide mb-4">แบบตรวจสอบมาตรฐาน กฟภ. (${code})</div>
                    <div class="font-bold text-[11px] mb-1">1 ข้อมูลทั่วไป</div>
                    <table class="w-full border-collapse border border-slate-800 text-[11px] mb-4">
                        <tr>
                            <td class="border border-slate-800 p-1.5 bg-slate-50 w-32">Station ID / สถานที่</td>
                            <td class="border border-slate-800 p-1.5"><input type="text" class="w-full border-0 outline-none bg-transparent"></td>
                            <td class="border border-slate-800 p-1.5 bg-slate-50 w-32">GIS Lat / Long</td>
                            <td class="border border-slate-800 p-1.5"><input type="text" class="w-full border-0 outline-none bg-transparent"></td>
                        </tr>
                    </table>
                    <div class="font-bold text-[11px] mb-1">2 รายการตรวจสอบบำรุงรักษาตามแบบฟอร์มต้นฉบับ</div>
                    <table class="w-full border-collapse border border-slate-800 text-[11px] mb-4">
                        <tr class="bg-slate-100 text-center">
                            <th class="border border-slate-800 p-1.5 text-left">รายการตรวจสอบ</th>
                            <th class="border border-slate-800 p-1.5 w-16">ปกติ</th>
                            <th class="border border-slate-800 p-1.5 w-16">ชำรุด</th>
                            <th class="border border-slate-800 p-1.5 w-16">ไม่มี</th>
                            <th class="border border-slate-800 p-1.5 w-48">ข้อบกพร่อง</th>
                        </tr>
                        ${[1,2,3,4,5,6,7,8].map(n => `
                            <tr>
                                <td class="border border-slate-800 p-1.5">รายการตรวจสอบข้อที่ 2.${n}</td>
                                <td class="border border-slate-800 text-center"><input type="radio" name="gen_${n}"></td>
                                <td class="border border-slate-800 text-center"><input type="radio" name="gen_${n}"></td>
                                <td class="border border-slate-800 text-center"><input type="radio" name="gen_${n}"></td>
                                <td class="border border-slate-800 p-0.5"><input type="text" class="w-full border-0 outline-none text-[11px] bg-transparent"></td>
                            </tr>
                        `).join('')}
                    </table>
                    <div class="border border-slate-800 p-2 h-20 mb-6"><span class="font-bold">ข้อเสนอแนะ / การปรับปรุงแก้ไข :</span><textarea class="w-full border-0 outline-none text-[11px] resize-none h-12 bg-transparent"></textarea></div>
                    <div class="flex justify-between text-[11px] pt-4 border-t border-slate-800">
                        <div>ผู้ตรวจ: <input type="text" class="border-b border-slate-800 outline-none w-32"> วันที่: <input type="date" class="border-b border-slate-800 outline-none"></div>
                        <div class="text-right font-mono text-[10px]">${code}</div>
                    </div>
                `
            };
        }

        function downloadOriginal() {
            alert("ดาวน์โหลดไฟล์ต้นฉบับ PDF สำเร็จ");
        }

        loadForm("015");
    </script>
</body>
</html>
