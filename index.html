<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบำรุงรักษาอุปกรณ์ไฟฟ้า - แบบฟอร์มตรวจสอบครบถ้วน 11 ใบงาน</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #F4F6FB; color: #1E293B; margin: 0; padding: 0; }
        .app-container { width: 210mm; max-width: 100%; margin: 0 auto; box-sizing: border-box; }
        .a4-sheet {
            width: 210mm;
            min-height: 297mm;
            padding: 12mm 15mm;
            background: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 128, 0.08), 0 5px 10px -5px rgba(0, 0, 128, 0.04);
            border-radius: 8px;
            position: relative;
            box-sizing: border-box;
            border: 1px solid #0000CD;
            margin: 0 auto;
        }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #0000CD; padding: 3px 6px; font-size: 10px; color: #1E293B; }
        th { background-color: #E6E6FA; font-weight: 600; }
        input[type="text"], input[type="date"] { border: none; outline: none; background: transparent; width: 100%; font-family: 'Sarabun', sans-serif; font-size: 10px; color: #0F172A; }
        textarea { color: #0F172A; }
        
        .theme-accent { background-color: #0000CD; color: #FFFFFF; }
        .theme-accent-hover:hover { background-color: #00008B; }
        .theme-border { border-color: #0000CD; }
        .theme-text-accent { color: #0000CD; }
        .accent-radio { accent-color: #0000CD; }

        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            .a4-sheet { box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 8mm !important; border-radius: 0 !important; border: none !important; }
            input[type="text"], input[type="date"] { border: none !important; }
        }
    </style>
</head>
<body class="pb-16">

    <!-- Header -->
    <header class="no-print bg-white border-b border-theme-border sticky top-0 z-50 shadow-xs">
        <div class="app-container px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-[#E6E6FA] border border-[#0000CD] flex items-center justify-center text-[#0000CD] p-2 shadow-2xs shrink-0 font-bold">
                    ⚡
                </div>
                <div>
                    <h1 class="text-xs font-bold text-[#0000CD]">ระบบบำรุงรักษาอุปกรณ์ไฟฟ้า</h1>
                    <p class="text-[10px] theme-text-accent">Digital Inspection & Maintenance Workspace</p>
                </div>
            </div>
            <button onclick="handleGoogleLogin()" class="flex items-center gap-2 px-3.5 py-2 border border-theme-border rounded-md text-xs font-medium hover:bg-[#E6E6FA] transition bg-white text-[#0000CD] cursor-pointer shadow-2xs">
                👤 เข้าสู่ระบบ Google
            </button>
        </div>
    </header>

    <main class="no-print app-container px-4 mt-6 text-xs space-y-4">
        <!-- Tab Navigation -->
        <div class="grid grid-cols-2 gap-2 bg-[#E6E6FA] p-1 rounded-xl border border-theme-border">
            <button class="py-2.5 bg-white text-[#0000CD] font-bold rounded-lg shadow-xs flex items-center justify-center gap-2 cursor-pointer">
                📋 แบบฟอร์มตรวจสอบหน้างาน (Inspection Forms)
            </button>
            <a href="planning.html" class="py-2.5 text-[#475569] hover:text-[#0000CD] font-medium rounded-lg flex items-center justify-center gap-2 transition">
                📊 แผนงาน PM & KPIs (PM Planning & Cost)
            </a>
        </div>

        <!-- Action Toolbar -->
        <div class="bg-white p-3 rounded-xl border border-theme-border shadow-xs flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
                <button onclick="saveNewRecord()" class="px-3 py-2 bg-[#0000CD] hover:bg-[#00008B] text-white rounded-lg font-medium transition cursor-pointer shadow-xs">💾 บันทึกใหม่</button>
                <button onclick="saveCurrentRecord()" class="px-3 py-2 bg-[#E6E6FA] hover:bg-[#D8BFD8] text-[#0000CD] rounded-lg font-medium transition cursor-pointer">📝 บันทึกทับ</button>
                <button onclick="copyNewDraft()" class="px-3 py-2 bg-[#E6E6FA] hover:bg-[#D8BFD8] text-[#0000CD] rounded-lg font-medium transition cursor-pointer">📄 คัดลอก</button>
                <button onclick="createNewForm()" class="px-3 py-2 bg-[#E6E6FA] hover:bg-[#D8BFD8] text-[#0000CD] rounded-lg font-medium transition cursor-pointer">➕ ฟอร์มใหม่</button>
                <button onclick="clearFormInputs()" class="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-lg font-medium transition cursor-pointer">🗑️ ล้าง</button>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="exportExcel()" class="px-3 py-2 bg-[#1E3A8A] hover:bg-[#1E40AF] text-white rounded-lg font-medium transition cursor-pointer shadow-xs">🟩 ส่งออก Excel</button>
                <button onclick="window.print()" class="px-3 py-2 bg-[#0000CD] hover:bg-[#00008B] text-white rounded-lg font-medium transition cursor-pointer shadow-xs">🖨️ พิมพ์/PDF</button>
            </div>
        </div>

        <!-- Form Selection Grid -->
        <div class="bg-white p-4 rounded-xl border border-theme-border shadow-xs">
            <div class="text-[#1E293B] font-bold mb-3 text-xs flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-[#0000CD]"></span> เลือกแบบฟอร์มใบงานตรวจสอบอุปกรณ์ไฟฟ้า (ครบถ้วนทั้ง 11 แบบฟอร์ม)
            </div>
            <div id="pillsContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2"></div>
        </div>
    </main>

    <!-- A4 Document Workspace -->
    <div class="app-container px-4 mt-8 overflow-x-auto flex justify-center">
        <div id="zoomContainer" class="transition-transform duration-200 origin-top">
            <div id="a4Paper" class="a4-sheet text-[#1E293B]"></div>
        </div>
    </div>

    <script>
        let currentFormKey = "015";

        const formsData = {
            "015": { title: "แบบตรวจสอบบำรุงรักษาหม้อแปลงจำหน่าย", code: "SF-07-0-015", render: () => getStandardForm("015", "แบบตรวจสอบบำรุงรักษาหม้อแปลงจำหน่าย", ["2.1 Drop Fuse", "2.2 Station Post Type Insulator", "2.3 สายเข้า-ออก Drop Fuse", "2.4 คอนสาย", "2.5 อุปกรณ์ป้องกันสัตว์", "2.6 Low Voltage Capacitor", "2.7 กับดักฟ้าผ่า (L/A)", "2.8 ตัวถังหม้อแปลง", "2.9 Bushing HV-LV", "2.10 Cover (Bushing,L/A,Term. kit)", "2.11 สายหน้าหม้อแปลง LV", "2.12 LV Ground", "2.13 HV Ground", "2.14 CT-TLM Meter (ถ้ามี)"]) },
            "016": { title: "แบบตรวจสอบบำรุงรักษา Load Break Switch", code: "SF-07-0-016", render: () => getStandardForm("016", "แบบตรวจสอบบำรุงรักษา Load Break Switch", ["2.1 ตัวถัง LBS /สลักล็อคการปลดสับ", "2.2 สถานะก๊าซ SF6", "2.3 Bushing", "2.4 กับดักฟ้าผ่า", "2.5 VT", "2.6 Drop Fuse ลง VT", "2.7 คอนสาย", "2.8 สายควบคุม LBS", "2.9 อุปกรณ์ป้องกันสัตว์"]) },
            "017": { title: "แบบตรวจสอบบำรุงรักษา Sectionalizer", code: "SF-07-0-017", render: () => getStandardForm("017", "แบบตรวจสอบบำรุงรักษา Sectionalizer", ["2.1 ตัวถัง SZ /สลักล็อคการปลดสับ", "2.2 สถานะก๊าซ SF6", "2.3 Bushing", "2.4 กับดักฟ้าผ่า", "2.5 คอนสาย", "2.6 สายควบคุม SZ", "2.7 อุปกรณ์ป้องกันสัตว์"]) },
            "018": { title: "แบบตรวจสอบบำรุงรักษา Ring Main Unit (RMU)", code: "SF-07-0-018", render: () => getStandardForm("018", "แบบตรวจสอบบำรุงรักษา Ring Main Unit (RMU)", ["2.1 สภาพตู้ครอบภายนอก", "2.2 สภาพ RMU / ห้อง", "2.3 ก๊าซ SF6", "2.4 ตัวแสดงสถานะสวิทซ์", "2.5 กุญแจล็อคป้องกันการปลด-สับ", "2.6 ระบบแรงดันไฟฟ้าเลี้ยงอุปกรณ์", "2.7 ระบบปลดสับด้วย Remote/Local"]) },
            "019": { title: "แบบตรวจสอบบำรุงรักษา Unit Substation", code: "SF-07-0-019", render: () => getStandardForm("019", "แบบตรวจสอบบำรุงรักษา Unit Substation", ["2.1 ตู้ครอบ Encloser", "2.2 สภาพ RMU ภายใน", "2.3 ก๊าซ SF6", "2.4 ตัวถังหม้อแปลง", "2.5 Bushing HV-LV", "2.6 สายหน้าหม้อแปลง", "2.7 อุปกรณ์ด้านแรงต่ำ CB / FUSE"]) },
            "020": { title: "แบบตรวจสอบบำรุงรักษา Capacitor Bank", code: "SF-07-0-020", render: () => getStandardForm("020", "แบบตรวจสอบบำรุงรักษา Capacitor Bank 12-24 kV ในสายป้อน", ["2.1 Drop Fuse", "2.2 Station Post Type Insulator", "2.3 กับดักฟ้าผ่า (L/A)", "2.4 Vacuum CB", "2.5 Supply ภายในตู้", "2.6 ตัวถังคาปาซิเตอร์ Cell", "2.7 Bushing และ Fuse ภายใน"]) },
            "021": { title: "แบบตรวจสอบเครื่องป้องกันหม้อแปลงวงจรตาข่าย", code: "SF-07-0-021", render: () => getStandardForm("021", "แบบตรวจสอบบำรุงรักษาเครื่องป้องกันหม้อแปลงวงจรตาข่าย", ["1.1 สถานะ MV.SW. (CLOSE)", "1.2 สถานะ NP (CLOSE)", "1.3 เบอร์ตุ้/ สีตู้ชัดเจน", "1.4 ระบบกราวด์ N และ G", "1.5 อุปกรณ์ป้องกันแรงดันเกิน", "3.1 อุปกรณ์ภายในตู้ / รีเลย์"]) },
            "022": { title: "แบบตรวจสอบหม้อแปลงวงจรตาข่ายและสวิตช์แรงกลาง", code: "SF-07-0-022", render: () => getStandardForm("022", "แบบตรวจสอบบำรุงรักษาหม้อแปลงวงจรตาข่ายและสวิตช์แรงกลาง", ["1.1 สวิตช์แรงกลาง (สภาพภายนอก/ปลดสับ)", "1.2 ก๊าซ SF6", "1.3 หัวต่อสาย/สายไฟฟ้า", "2.1 ตัวถังหม้อแปลง", "2.2 ระดับน้ำมันหม้อแปลง", "2.3 ฟิวส์ 12 kV"]) },
            "023": { title: "แบบตรวจสอบทดสอบและกรองน้ำมันหม้อแปลง", code: "SF-07-0-023", render: () => getStandardForm("023", "แบบตรวจสอบบำรุงรักษาทดสอบและกรองน้ำมันหม้อแปลงวงจรตาข่าย", ["1. ทดสอบค่า Breakdown Voltage (5 ครั้งก่อนกรอง)", "2. ดำเนินการกรองน้ำมันรอบที่ 1", "3. ทดสอบค่าหลังกรองรอบที่ 1", "4. ดำเนินการกรองน้ำมันรอบที่ 2", "5. ทดสอบค่าหลังกรองรอบที่ 2 (เกณฑ์มาตรฐาน > 26 kV)"]) },
            "024": { title: "รายงานผลการตรวจสอบจุดร้อนแดง (Hot Spot)", code: "SF-07-0-024", render: () => getStandardForm("024", "รายงานผลการตรวจสอบจุดร้อนแดง (Hot Spot) ด้วยกล้อง Thermovision", ["1. บันทึกภาพถ่ายจริงและภาพถ่ายความร้อน", "2. วัดอุณหภูมิสูงสุดที่จุดวัด (Delta T)", "3. ประเมินลำดับความสำคัญ (Priority 1-4)", "4. ส่งต่อกลุ่มงานเพื่อดำเนินการแก้ไข"]) },
            "025": { title: "รายงานผลการตรวจสอบการคายประจุไฟฟ้า (Partial Discharge)", code: "SF-07-0-025", render: () => getStandardForm("025", "รายงานผลการตรวจสอบการคายประจุไฟฟ้าบางส่วน (Partial Discharge) ด้วย Acoustic Camera", ["1. บันทึกภาพถ่ายกล้องปกติและ Acoustic Camera", "2. วัดระดับความเข้มเสียง (dB)", "3. ประเมินระดับความรุนแรงจาก Software NL Cloud", "4. ส่งต่อดำเนินการแก้ไขเร่งด่วน"]) }
        };

        function getStandardForm(codeKey, titleText, checklistItems) {
            return `
                <div class="text-center font-bold text-sm mb-3 text-[#0000CD]">${titleText}</div>
                <table>
                    <tr><td class="bg-[#E6E6FA] font-bold text-center w-8 border border-[#0000CD]">1</td><td colspan="5" class="bg-[#E6E6FA] font-bold border border-[#0000CD]">ข้อมูลทั่วไป</td></tr>
                    <tr>
                        <td colspan="2" class="bg-[#E6E6FA] w-28 border border-[#0000CD]">Station ID</td><td colspan="2" class="border border-[#0000CD]"><input type="text" placeholder="ระบุ Station ID..."></td>
                        <td class="bg-[#E6E6FA] w-20 border border-[#0000CD]">สถานที่</td><td class="border border-[#0000CD]"><input type="text" placeholder="ระบุสถานที่..."></td>
                    </tr>
                    <tr>
                        <td colspan="2" class="bg-[#E6E6FA] border border-[#0000CD] flex items-center justify-between">
                            <span>GIS</span>
                            <button onclick="getGPSLocation('latInput_${codeKey}', 'longInput_${codeKey}')" class="no-print theme-accent px-1.5 py-0.5 rounded text-[9px] cursor-pointer">📍 ดึงพิกัด</button>
                        </td>
                        <td colspan="2" class="border border-[#0000CD]">Lat. <input type="text" id="latInput_${codeKey}"></td>
                        <td colspan="2" class="border border-[#0000CD]">Long. <input type="text" id="longInput_${codeKey}"></td>
                    </tr>
                    <tr>
                        <td colspan="2" class="bg-[#E6E6FA] border border-[#0000CD]">หมายเลข MEA</td><td colspan="4" class="border border-[#0000CD]"><input type="text" placeholder="ระบุหมายเลขอุปกรณ์ MEA..."></td>
                    </tr>
                    <tr><td class="bg-[#E6E6FA] font-bold text-center border border-[#0000CD]">2</td><td colspan="5" class="bg-[#E6E6FA] font-bold border border-[#0000CD]">รายการตรวจสอบและประเมินผล</td></tr>
                    <tr class="bg-[#E6E6FA] text-center font-bold">
                        <td colspan="2" class="border border-[#0000CD]">รายการหัวข้อการตรวจสอบ</td>
                        <td class="w-12 border border-[#0000CD]">ปกติ</td><td class="w-12 border border-[#0000CD]">ชำรุด</td><td class="w-12 border border-[#0000CD]">ไม่มี</td>
                        <td class="border border-[#0000CD]">ข้อบกพร่อง / การดำเนินการแก้ไข</td>
                    </tr>
                    ${checklistItems.map((item, i) => `
                        <tr>
                            <td colspan="2" class="border border-[#0000CD]">${item}</td>
                            <td class="text-center border border-[#0000CD]"><input type="radio" name="chk_${codeKey}_${i}" class="accent-radio"></td>
                            <td class="text-center border border-[#0000CD]"><input type="radio" name="chk_${codeKey}_${i}" class="accent-radio"></td>
                            <td class="text-center border border-[#0000CD]"><input type="radio" name="chk_${codeKey}_${i}" class="accent-radio"></td>
                            <td class="border border-[#0000CD]"><input type="text" placeholder="บันทึกข้อบกพร่อง..."></td>
                        </tr>
                    `).join('')}
                    <tr><td class="bg-[#E6E6FA] font-bold text-center border border-[#0000CD]">3</td><td colspan="5" class="bg-[#E6E6FA] font-bold border border-[#0000CD]">สิ่งที่ต้องปรับปรุงหรือข้อเสนอแนะเพิ่มเติม :</td></tr>
                    <tr><td colspan="6" class="border border-[#0000CD] h-12 align-top"><textarea class="w-full border-0 outline-none text-[10px] resize-none h-10 bg-transparent" placeholder="พิมพ์ข้อเสนอแนะ..."></textarea></td></tr>
                </table>
                <table class="mt-2 border border-[#0000CD]">
                    <tr><td colspan="3" class="w-1/2 border border-[#0000CD]">ผู้ตรวจ <input type="text" placeholder="ชื่อผู้ตรวจสอบ..."></td><td colspan="3" class="w-1/2 border border-[#0000CD]">ผู้ตรวจสอบ <input type="text" placeholder="ชื่อหัวหน้างาน..."></td></tr>
                    <tr><td colspan="3" class="border border-[#0000CD]">ตำแหน่ง <input type="text" placeholder="ตำแหน่ง..."></td><td colspan="3" class="border border-[#0000CD]">ตำแหน่ง <input type="text" placeholder="ตำแหน่ง..."></td></tr>
                    <tr><td colspan="3" class="border border-[#0000CD]">วันที่ <input type="date"></td><td colspan="3" class="border border-[#0000CD]">วันที่ <input type="date"></td></tr>
                </table>
                <div class="flex justify-between text-[9px] mt-2 pt-1 border-t border-[#0000CD] text-[#0000CD]"><span>บันทึกระบบดิจิทัล</span><span class="font-mono">SF-07-0-${codeKey}</span></div>
            `;
        }

        const pillsContainer = document.getElementById('pillsContainer');
        const a4Paper = document.getElementById('a4Paper');

        function loadForm(key) {
            currentFormKey = key;
            const form = formsData[key] || formsData["015"];
            a4Paper.innerHTML = form.render();

            document.querySelectorAll('.form-pill').forEach(btn => {
                if(btn.dataset.key === key) {
                    btn.className = "form-pill px-3.5 py-2.5 theme-accent text-white rounded-md font-semibold text-xs whitespace-nowrap shadow-xs cursor-pointer transition-all";
                } else {
                    btn.className = "form-pill px-3.5 py-2.5 bg-white border border-theme-border text-[#1E293B] rounded-md font-medium text-xs whitespace-nowrap hover:bg-[#E6E6FA] cursor-pointer transition-all";
                }
            });
        }

        Object.keys(formsData).forEach(key => {
            const btn = document.createElement('button');
            btn.dataset.key = key;
            btn.className = "form-pill";
            btn.innerText = formsData[key].code;
            btn.onclick = () => loadForm(key);
            pillsContainer.appendChild(btn);
        });

        function getGPSLocation(latId, longId) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(6);
                        const lon = position.coords.longitude.toFixed(6);
                        document.getElementById(latId).value = lat;
                        document.getElementById(longId).value = lon;
                        alert("📍 ดึงพิกัด GPS สำเร็จ: " + lat + ", " + lon);
                    },
                    (error) => {
                        alert("⚠️ ไม่สามารถดึงพิกัดได้: กรุณาอนุญาตการเข้าถึงตำแหน่ง (GPS)");
                    }
                );
            } else {
                alert("❌ เบราว์เซอร์ของคุณไม่รองรับการระบุตำแหน่ง GPS");
            }
        }

        function handleGoogleLogin() { alert("🔗 เชื่อมต่อบัญชี Google สำเร็จเรียบร้อย"); }
        function saveNewRecord() { alert("💾 บันทึกรายการตรวจสอบใหม่ลงในระบบสำเร็จ!"); }
        function saveCurrentRecord() { alert("💾 บันทึกข้อมูลฟอร์มปัจจุบันสำเร็จ!"); }
        function copyNewDraft() { alert("📄 คัดลอกฉบับใหม่สำเร็จ!"); }
        function createNewForm() { loadForm(currentFormKey); alert("➕ เริ่มต้นฟอร์มใหม่เรียบร้อย"); }
        function clearFormInputs() { loadForm(currentFormKey); alert("🧹 ล้างข้อมูลในฟอร์มเรียบร้อยแล้ว"); }
        function exportExcel() { alert("🟩 ส่งออกข้อมูลเป็นไฟล์ Excel สำเร็จ!"); }
