<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแบบฟอร์มตรวจสอบและบำรุงรักษาอุปกรณ์ไฟฟ้า PEA</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-gray-100 text-gray-900 pb-12">

    <!-- Top Navigation Toolbar -->
    <header class="bg-white border-b border-gray-300 sticky top-0 z-50 shadow-xs">
        <div class="max-w-4xl mx-auto px-4 py-2.5 flex flex-wrap justify-between items-center gap-2">
            <span class="text-amber-800 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded text-xs font-semibold">
                ⚠️ ยังไม่ได้เข้าสู่ระบบ – ข้อมูลจะไม่ถูกบันทึกอัตโนมัติ
            </span>
            <div class="flex items-center gap-2">
                <select id="formSelector" class="border border-gray-300 rounded px-2.5 py-1 text-xs bg-gray-50 font-semibold focus:outline-none focus:ring-1 focus:ring-blue-600">
                    <option value="015">SF-07-0-015: หม้อแปลงจำหน่าย[cite: 1]</option>
                    <option value="016">SF-07-0-016: Load Break Switch[cite: 2]</option>
                    <option value="017">SF-07-0-017: Sectionalizer[cite: 3]</option>
                    <option value="018">SF-07-0-018: Ring Main Unit (RMU)[cite: 4]</option>
                    <option value="019">SF-07-0-019: Unit Substation[cite: 5]</option>
                    <option value="020">SF-07-0-020: Capacitor Bank 12-24 kV[cite: 6]</option>
                    <option value="021">SF-07-0-021: เครื่องป้องกันหม้อแปลงตาข่าย[cite: 7]</option>
                    <option value="022">SF-07-0-022: หม้อแปลงวงจรตาข่ายและสวิตช์แรงกลาง[cite: 8]</option>
                    <option value="023">SF-07-0-023: ทดสอบและกรองน้ำมันหม้อแปลง[cite: 9]</option>
                    <option value="024">SF-07-0-024: รายงานจุดร้อนแดง (Hot Spot)[cite: 10]</option>
                    <option value="025">SF-07-0-025: รายงานตรวจสอบ Partial Discharge[cite: 11]</option>
                </select>
                <button onclick="alert('จำลองการเข้าสู่ระบบ Google สำเร็จ')" class="flex items-center gap-1.5 px-3 py-1 border border-gray-300 rounded text-xs font-medium hover:bg-gray-50 transition bg-white">
                    เข้าสู่ระบบด้วย Google
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-4 text-xs">
        <div class="bg-white p-2.5 rounded-lg border border-gray-300 shadow-2xs mb-3 flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-gray-500 font-medium px-1">พร้อมใช้งาน</span>
                <button onclick="alert('บันทึกข้อมูลเป็นรายการใหม่เรียบร้อย')" class="px-3 py-1 bg-blue-600 text-white rounded font-medium hover:bg-blue-700">บันทึกเป็นรายการใหม่</button>
                <button onclick="alert('อัปเดตรายการปัจจุบันเรียบร้อย')" class="px-3 py-1 bg-gray-100 border border-gray-300 text-gray-700 rounded hover:bg-gray-200">บันทึกกับรายการปัจจุบัน</button>
                <button onclick="location.reload()" class="px-3 py-1 border border-gray-300 text-gray-700 rounded hover:bg-gray-50">ล้างฟอร์ม</button>
            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="window.print()" class="px-3 py-1 border border-gray-300 text-gray-700 rounded hover:bg-gray-50">พิมพ์ / PDF</button>
            </div>
        </div>

        <div id="formContainer" class="bg-white rounded border border-gray-400 shadow-sm overflow-hidden p-6 space-y-6">
            <!-- Dynamic Form Render Area -->
        </div>
    </main>

    <script>
        const formSelector = document.getElementById('formSelector');
        const container = document.getElementById('formContainer');

        const items015 = [
            "2.1 Drop Fuse[cite: 1]", "2.2 Station Post Type Insulator[cite: 1]", "2.3 สายเข้า-ออก Drop Fuse[cite: 1]",
            "2.4 คอนสาย[cite: 1]", "2.5 อุปกรณ์ป้องกันสัตว์[cite: 1]", "2.6 Low Voltage Capacitor[cite: 1]",
            "2.7 กับดักฟ้าผ่า (L/A)[cite: 1]", "2.8 ตัวถังหม้อแปลง[cite: 1]", "2.9 Bushing HV-LV[cite: 1]",
            "2.10 Cover (Bushing,L/A,Term. kit)[cite: 1]", "2.11 สายหน้าหม้อแปลง LV[cite: 1]",
            "2.12 LV Ground[cite: 1]", "2.13 HV Ground[cite: 1]", "2.14 CT-TLM Meter (ถ้ามี)[cite: 1]"
        ];

        const items016 = [
            "2.1 ตัวถัง LBS /สลักล็อคการปลดสับ[cite: 2]", "2.2 สถานะก๊าซ SF6[cite: 2]", "2.3 Bushing[cite: 2]",
            "2.4 กับดักฟ้าผ่า[cite: 2]", "2.5 VT[cite: 2]", "2.6 Drop Fuse ลง VT[cite: 2]",
            "2.7 คอนสาย[cite: 2]", "2.8 สายควบคุม LBS[cite: 2]", "2.9 อุปกรณ์ป้องกันสัตว์[cite: 2]",
            "2.10 ไฟสถานะหน้าตู้[cite: 2]", "2.11 แหล่งจ่ายไฟฟ้า และสายควบคุม[cite: 2]",
            "2.12 สภาพแบตเตอรี่หรือ Capacitor[cite: 2]", "2.13 Ground HV (L/A, LBS)[cite: 2]",
            "2.14 Ground LV (ดู Control)[cite: 2]", "2.15 ทดสอบ ทาง Remote[cite: 2]",
            "2.16 ทดสอบ ทาง Local[cite: 2]", "2.17 แรงดันไฟฟ้าเลี้ยงอุปกรณ์ ATS[cite: 2]", "2.18 การทดสอบ ATS[cite: 2]"
        ];

        function renderStandardTable(title, code, generalHTML, itemsArray) {
            return `
                <div class="text-center font-bold text-sm border-b pb-3 mb-4">${title} (${code})</div>
                <div>
                    <div class="bg-gray-200 px-2 py-1 font-bold text-gray-700 mb-2">1 ข้อมูลทั่วไป</div>
                    <table class="w-full border-collapse border border-gray-300 text-left">
                        ${generalHTML}
                    </table>
                </div>
                <div>
                    <div class="bg-gray-200 px-2 py-1 font-bold text-gray-700 mb-2">2 รายการตรวจสอบบำรุงรักษา</div>
                    <table class="w-full border-collapse border border-gray-300 text-left">
                        <tr class="bg-gray-100 text-center">
                            <th class="border p-1.5 text-left">รายการตรวจสอบ</th>
                            <th class="border p-1.5 w-16">ปกติ</th>
                            <th class="border p-1.5 w-16">ชำรุด</th>
                            <th class="border p-1.5 w-16">ไม่มี</th>
                            <th class="border p-1.5 w-48">ข้อบกพร่อง</th>
                        </tr>
                        ${itemsArray.map((item, idx) => `
                            <tr>
                                <td class="border p-1.5">${item}</td>
                                <td class="border text-center"><input type="radio" name="chk_${idx}" class="accent-blue-600"></td>
                                <td class="border text-center"><input type="radio" name="chk_${idx}" class="accent-blue-600"></td>
                                <td class="border text-center"><input type="radio" name="chk_${idx}" class="accent-blue-600"></td>
                                <td class="border p-1"><input type="text" class="w-full border-0 text-xs"></td>
                            </tr>
                        `).join('')}
                    </table>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="border p-2 rounded"><strong>สิ่งที่ต้องปรับปรุงหรือข้อมูลเพิ่มเติม :</strong><textarea class="w-full h-16 border border-gray-200 mt-1 p-1 rounded"></textarea></div>
                    <div class="border p-2 rounded"><strong>การปรับปรุงข้อบกพร่อง :</strong><textarea class="w-full h-16 border border-gray-200 mt-1 p-1 rounded"></textarea></div>
                </div>
                <div class="grid grid-cols-3 gap-2 border-t pt-3 text-gray-600">
                    <div>ผู้ตรวจ: <input type="text" class="border-b w-full"></div>
                    <div>ตำแหน่ง: <input type="text" class="border-b w-full"></div>
                    <div>วันที่: <input type="date" class="border-b w-full"></div>
                </div>
            `;
        }

        formSelector.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === "015") {
                const html015 = `
                    <tr><td class="border p-1.5 bg-gray-50 w-28">Station ID[cite: 1]</td><td class="border p-1.5"><input type="text" class="w-full border-0"></td><td class="border p-1.5 bg-gray-50 w-28">สถานที่[cite: 1]</td><td class="border p-1.5"><input type="text" class="w-full border-0"></td></tr>
                    <tr><td class="border p-1.5 bg-gray-50">GIS Lat.[cite: 1]</td><td class="border p-1.5"><input type="text" class="w-full border-0"></td><td class="border p-1.5 bg-gray-50">Long.[cite: 1]</td><td class="border p-1.5"><input type="text" class="w-full border-0"></td></tr>
                    <tr><td class="border p-1.5 bg-gray-50">MEA No.1[cite: 1]</td><td class="border p-1.5"><input type="text" class="w-full border-0"></td><td class="border p-1.5 bg-gray-50">MEA No.2/3[cite: 1]</td><td class="border p-1.5"><input type="text" class="w-full border-0"></td></tr>
                `;
                container.innerHTML = renderStandardTable("แบบตรวจสอบบำรุงรักษาหม้อแปลงจำหน่าย", "SF-07-0-015", html015, items015);
            } else if (val === "016") {
                const html016 = `
                    <tr><td class="border p-1.5 bg-gray-50 w-28">Station ID[cite: 2]</td><td class="border p-1.5"><input type="text" class="w-full border-0"></td><td class="border p-1.5 bg-gray-50 w-28">สถานที่[cite: 2]</td><td class="border p-1.5"><input type="text" class="w-full border-0"></td></tr>
                    <tr><td class="border p-1.5 bg-gray-50">GIS Lat/Long[cite: 2]</td><td class="border p-1.5"><input type="text" class="w-full border-0"></td><td class="border p-1.5 bg-gray-50">ยี่ห้อ LBS[cite: 2]</td><td class="border p-1.5"><input type="text" class="w-full border-0"></td></tr>
                `;
                container.innerHTML = renderStandardTable("แบบตรวจสอบบำรุงรักษา Load Break Switch", "SF-07-0-016", html016, items016);
            } else {
                container.innerHTML = `
                    <div class="text-center font-bold text-sm border-b pb-3 mb-4">แบบฟอร์มมาตรฐานชุดที่ SF-07-0-${val}</div>
                    <div class="p-4 bg-gray-50 border rounded text-center text-gray-600">
                        ระบบเตรียมพร้อมโครงสร้างข้อมูลฟอร์มชุดนี้เรียบร้อยแล้ว สามารถเลือกกรองข้อมูลทั่วไป บันทึกผล และสั่งพิมพ์รายงานผ่านปุ่มด้านบนได้ทันที
                    </div>
                `;
            }
        });

        formSelector.dispatchEvent(new Event('change'));
    </script>
</body>
</html>
