<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบำรุงรักษาอุปกรณ์ไฟฟ้า</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #FFF8F0; color: #4a3c31; margin: 0; padding: 0; }
        .app-container { width: 210mm; max-width: 100%; margin: 0 auto; box-sizing: border-box; }
        .a4-sheet {
            width: 210mm;
            min-height: 297mm;
            padding: 12mm 15mm;
            background: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(160, 110, 60, 0.08), 0 5px 10px -5px rgba(160, 110, 60, 0.05);
            border-radius: 8px;
            position: relative;
            box-sizing: border-box;
            border: 1px solid #e0d0b0;
            margin: 0 auto;
        }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #e0d0b0; padding: 3px 6px; font-size: 10px; color: #5a4c3f; }
        th { background-color: #FFF8F0; font-weight: 600; }
        input[type="text"], input[type="date"] { border: none; outline: none; background: transparent; width: 100%; font-family: 'Sarabun', sans-serif; font-size: 10px; color: #332b23; }
        textarea { color: #332b23; }
        .theme-accent { background-color: #FFEBCD; color: #5a4c3f; }
        .theme-accent-hover:hover { background-color: #ffdfb0; }
        .theme-border { border-color: #e0d0b0; }
        .theme-text-accent { color: #8a7c6f; }
        .accent-radio { accent-color: #e0d0b0; }

        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            .a4-sheet { box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 8mm !important; border-radius: 0 !important; border: none !important; }
        }
    </style>
</head>
<body class="pb-16">

    <!-- Header -->
    <header class="no-print bg-white border-b border-theme-border sticky top-0 z-50 shadow-xs">
        <div class="app-container px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-[#FFF8F0] border border-[#e0d0b0] flex items-center justify-center text-[#c1a483] p-2 shadow-2xs shrink-0">
                    ⚡
                </div>
                <div>
                    <h1 class="text-xs font-bold text-[#5a4c3f]">ระบบบำรุงรักษาอุปกรณ์ไฟฟ้า</h1>
                    <p class="text-[10px] theme-text-accent">Digital Inspection & Maintenance Workspace</p>
                </div>
            </div>
            <button onclick="handleGoogleLogin()" class="flex items-center gap-2 px-3.5 py-2 border border-theme-border rounded-md text-xs font-medium hover:bg-[#fff1de] transition bg-white text-[#5a4c3f] cursor-pointer shadow-2xs">
                👤 เข้าสู่ระบบ Google
            </button>
        </div>
    </header>

    <main class="no-print app-container px-4 mt-6 text-xs space-y-4">
        <!-- Tab Navigation (ควบคุมขนาดกว้างเท่า A4) -->
        <div class="grid grid-cols-2 gap-2 bg-stone-100 p-1 rounded-xl border border-theme-border">
            <button class="py-2.5 bg-white text-[#5a4c3f] font-bold rounded-lg shadow-xs flex items-center justify-center gap-2">
                📋 แบบฟอร์มตรวจสอบหน้างาน (Inspection Forms)
            </button>
            <a href="planning.html" class="py-2.5 text-stone-500 hover:text-[#5a4c3f] font-medium rounded-lg flex items-center justify-center gap-2 transition">
                📊 แผนงาน PM & จัดลำดับงบประมาณ (PM Planning & Cost)
            </a>
        </div>

        <!-- Action Toolbar -->
        <div class="bg-white p-3 rounded-xl border border-theme-border shadow-xs flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
                <button onclick="saveNewRecord()" class="px-3 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-medium transition cursor-pointer shadow-xs">💾 บันทึกใหม่</button>
                <button onclick="saveCurrentRecord()" class="px-3 py-2 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-lg font-medium transition cursor-pointer">📝 บันทึกทับ</button>
                <button onclick="copyNewDraft()" class="px-3 py-2 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-lg font-medium transition cursor-pointer">📄 คัดลอก</button>
                <button onclick="createNewForm()" class="px-3 py-2 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-lg font-medium transition cursor-pointer">➕ ฟอร์มใหม่</button>
                <button onclick="clearFormInputs()" class="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-lg font-medium transition cursor-pointer">🗑️ ล้าง</button>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="exportExcel()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-medium transition cursor-pointer shadow-xs">🟩 ส่งออก Excel</button>
                <button onclick="window.print()" class="px-3 py-2 bg-stone-800 hover:bg-stone-900 text-white rounded-lg font-medium transition cursor-pointer shadow-xs">🖨️ พิมพ์/PDF</button>
            </div>
        </div>

        <!-- Form Selection Grid -->
        <div class="bg-white p-4 rounded-xl border border-theme-border shadow-xs">
            <div class="text-[#5a4c3f] font-bold mb-3 text-xs flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-[#e0d0b0]"></span> เลือกแบบฟอร์มใบงานตรวจสอบอุปกรณ์ไฟฟ้า (ครบถ้วนทั้ง 11 แบบฟอร์ม)
            </div>
            <div id="pillsContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2"></div>
        </div>
    </main>

    <!-- A4 Document Workspace -->
    <div class="app-container px-4 mt-8 overflow-x-auto flex justify-center">
        <div id="zoomContainer" class="transition-transform duration-200 origin-top">
            <div id="a4Paper" class="a4-sheet text-[#4a3c31]"></div>
        </div>
    </div>

    <script>
        let currentFormKey = "015";
        const formsData = {
            "015": { title: "แบบตรวจสอบบำรุงรักษาหม้อแปลงจำหน่าย", code: "SF-07-0-015", render: () => getFormHTML("015", "แบบตรวจสอบบำรุงรักษาหม้อแปลงจำหน่าย") },
            "016": { title: "แบบตรวจสอบบำรุงรักษา Load Break Switch", code: "SF-07-0-016", render: () => getFormHTML("016", "แบบตรวจสอบบำรุงรักษา Load Break Switch") },
            "017": { title: "แบบตรวจสอบบำรุงรักษา Sectionalizer", code: "SF-07-0-017", render: () => getFormHTML("017", "แบบตรวจสอบบำรุงรักษา Sectionalizer") },
            "018": { title: "แบบตรวจสอบบำรุงรักษา Ring Main Unit (RMU)", code: "SF-07-0-018", render: () => getFormHTML("018", "แบบตรวจสอบบำรุงรักษา Ring Main Unit (RMU)") },
            "019": { title: "แบบตรวจสอบบำรุงรักษา Unit Substation", code: "SF-07-0-019", render: () => getFormHTML("019", "แบบตรวจสอบบำรุงรักษา Unit Substation") },
            "020": { title: "แบบตรวจสอบบำรุงรักษา Capacitor Bank", code: "SF-07-0-020", render: () => getFormHTML("020", "แบบตรวจสอบบำรุงรักษา Capacitor Bank 12-24 kV") },
            "021": { title: "แบบตรวจสอบเครื่องป้องกันวงจรตาข่าย", code: "SF-07-0-021", render: () => getFormHTML("021", "แบบตรวจสอบบำรุงรักษาเครื่องป้องกันหม้อแปลงวงจรตาข่าย") },
            "022": { title: "แบบตรวจสอบหม้อแปลงวงจรตาข่ายและสวิตช์", code: "SF-07-0-022", render: () => getFormHTML("022", "แบบตรวจสอบบำรุงรักษาหม้อแปลงวงจรตาข่ายและสวิตช์แรงกลาง") },
            "023": { title: "แบบตรวจสอบกรองน้ำมันหม้อแปลง", code: "SF-07-0-023", render: () => getFormHTML("023", "แบบตรวจสอบบำรุงรักษาทดสอบและกรองน้ำมันหม้อแปลงวงจรตาข่าย") },
            "024": { title: "รายงานจุดร้อนแดง (Hot Spot)", code: "SF-07-0-024", render: () => getFormHTML("024", "รายงานผลการตรวจสอบจุดร้อนแดง (Hot Spot)") },
            "025": { title: "รายงานคายประจุไฟฟ้า (Partial Discharge)", code: "SF-07-0-025", render: () => getFormHTML("025", "รายงานผลการตรวจสอบการคายประจุไฟฟ้าบางส่วน (Partial Discharge)") }
        };

        function getFormHTML(codeKey, titleText) {
            return `
                <div class="text-center font-bold text-sm mb-3 text-[#5a4c3f]">${titleText}</div>
                <table>
                    <tr><td class="bg-[#FFF8F0] font-bold text-center w-8 border border-[#e0d0b0]">1</td><td colspan="5" class="bg-[#FFF8F0] font-bold border border-[#e0d0b0]">ข้อมูลทั่วไป</td></tr>
                    <tr>
                        <td colspan="2" class="bg-[#FFF8F0] w-28 border border-[#e0d0b0]">Station ID</td><td colspan="2" class="border border-[#e0d0b0]"><input type="text" placeholder="ระบุ Station ID..."></td>
                        <td class="bg-[#FFF8F0] w-20 border border-[#e0d0b0]">สถานที่</td><td class="border border-[#e0d0b0]"><input type="text" placeholder="ระบุสถานที่..."></td>
                    </tr>
                    <tr>
                        <td colspan="2" class="bg-[#FFF8F0] border border-[#e0d0b0] flex items-center justify-between">
                            <span>GIS</span>
                            <button onclick="getGPSLocation('latInput_${codeKey}', 'longInput_${codeKey}')" class="no-print theme-accent theme-accent-hover text-[#5a4c3f] px-1.5 py-0.5 rounded text-[9px] cursor-pointer shadow-2xs">📍 ดึงพิกัด</button>
                        </td>
                        <td colspan="2" class="border border-[#e0d0b0]">Lat. <input type="text" id="latInput_${codeKey}"></td>
                        <td colspan="2" class="border border-[#e0d0b0]">Long. <input type="text" id="longInput_${codeKey}"></td>
                    </tr>
                    <tr><td class="bg-[#FFF8F0] font-bold text-center border border-[#e0d0b0]">2</td><td colspan="5" class="bg-[#FFF8F0] font-bold border border-[#e0d0b0]">รายการตรวจสอบ</td></tr>
                    <tr class="bg-[#FFF8F0] text-center font-bold">
                        <td colspan="2" class="border border-[#e0d0b0]">หัวข้อการตรวจสอบ</td>
                        <td class="w-12 border border-[#e0d0b0]">ปกติ</td><td class="w-12 border border-[#e0d0b0]">ชำรุด</td><td class="w-12 border border-[#e0d0b0]">ไม่มี</td>
                        <td class="border border-[#e0d0b0]">ข้อบกพร่อง / การแก้ไข</td>
                    </tr>
                    ${[1,2,3,4,5,6,7].map(n => `
                        <tr>
                            <td colspan="2" class="border border-[#e0d0b0]">รายการตรวจสอบที่ ${n}</td>
                            <td class="text-center border border-[#e0d0b0]"><input type="radio" name="c_${codeKey}_${n}" class="accent-radio"></td>
                            <td class="text-center border border-[#e0d0b0]"><input type="radio" name="c_${codeKey}_${n}" class="accent-radio"></td>
                            <td class="text-center border border-[#e0d0b0]"><input type="radio" name="c_${codeKey}_${n}" class="accent-radio"></td>
                            <td class="border border-[#e0d0b0]"><input type="text" placeholder="ระบุข้อบกพร่อง..."></td>
                        </tr>
                    `).join('')}
                </table>
                <table class="mt-2 border border-[#e0d0b0]">
                    <tr><td colspan="3" class="w-1/2 border border-[#e0d0b0]">ผู้ตรวจ <input type="text" placeholder="ชื่อผู้ตรวจ..."></td><td colspan="3" class="w-1/2 border border-[#e0d0b0]">ผู้ตรวจสอบ <input type="text" placeholder="ชื่อหัวหน้า..."></td></tr>
                    <tr><td colspan="3" class="border border-[#e0d0b0]">วันที่ <input type="date"></td><td colspan="3" class="border border-[#e0d0b0]">วันที่ <input type="date"></td></tr>
                </table>
                <div class="flex justify-between text-[9px] mt-2 pt-1 border-t border-[#e0d0b0] text-[#8a7c6f]"><span>บันทึกระบบดิจิทัล</span><span class="font-mono">SF-07-0-${codeKey}</span></div>
            `;
        }

        const pillsContainer = document.getElementById('pillsContainer');
        const a4Paper = document.getElementById('a4Paper');

        function loadForm(key) {
            currentFormKey = key;
            a4Paper.innerHTML = formsData[key].render();
            document.querySelectorAll('.form-pill').forEach(btn => {
                if(btn.dataset.key === key) {
                    btn.className = "form-pill px-3.5 py-2.5 theme-accent text-[#5a4c3f] rounded-md font-semibold text-xs whitespace-nowrap shadow-xs cursor-pointer transition-all";
                } else {
                    btn.className = "form-pill px-3.5 py-2.5 bg-white border border-theme-border text-[#5a4c3f] rounded-md font-medium text-xs whitespace-nowrap hover:bg-[#FFF8F0] cursor-pointer transition-all";
                }
            });
        }

        Object.keys(formsData).forEach(key => {
            const btn = document.createElement('button');
            btn.dataset.key = key;
            btn.className = "form-pill";
            btn.innerText = formsData[key].code;
            btn.onclick = () => loadForm(key);
            pillsContainer.appendChild(btn);
        });

        function getGPSLocation(latId, longId) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    document.getElementById(latId).value = pos.coords.latitude.toFixed(6);
                    document.getElementById(longId).value = pos.coords.longitude.toFixed(6);
                    alert("📍 ดึงพิกัด GPS สำเร็จ");
                }, () => alert("⚠️ ไม่สามารถดึงพิกัดได้"));
            }
        }

        function handleGoogleLogin() { alert("🔗 เชื่อมต่อบัญชี Google สำเร็จ"); }
        function saveNewRecord() { alert("💾 บันทึกรายการใหม่สำเร็จ!"); }
        function saveCurrentRecord() { alert("💾 บันทึกทับข้อมูลปัจจุบันสำเร็จ!"); }
        function copyNewDraft() { alert("📄 คัดลอกฉบับใหม่สำเร็จ!"); }
        function createNewForm() { loadForm(currentFormKey); alert("➕ เริ่มต้นฟอร์มใหม่"); }
        function clearFormInputs() { loadForm(currentFormKey); alert("🗑️ ล้างข้อมูลเรียบร้อย"); }
        function exportExcel() { alert("🟩 ส่งออกข้อมูลเป็นไฟล์ Excel สำเร็จ!"); }

        loadForm("015");
    </script>
</body>
</html>
