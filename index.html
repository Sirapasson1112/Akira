<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบและบำรุงรักษาอุปกรณ์ไฟฟ้า (PEA)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <div>
        <!-- Modern Navigation Header -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-xs">
            <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold text-sm shadow-xs">PEA</div>
                    <div>
                        <h1 class="text-sm font-bold text-slate-900">ระบบฟอร์มตรวจสอบอุปกรณ์ไฟฟ้าสนาม</h1>
                        <p class="text-xs text-slate-500">ระบบบันทึกข้อมูลและรายงานผลการปฏิบัติงาน</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <select id="formSelector" class="w-full sm:w-80 border border-slate-300 rounded-lg px-3 py-2 text-xs font-semibold bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="015">SF-07-0-015: หม้อแปลงจำหน่าย</option>
                        <option value="016">SF-07-0-016: Load Break Switch</option>
                        <option value="017">SF-07-0-017: Sectionalizer</option>
                        <option value="018">SF-07-0-018: Ring Main Unit (RMU)</option>
                        <option value="019">SF-07-0-019: Unit Substation</option>
                        <option value="020">SF-07-0-020: Capacitor Bank 12-24 kV</option>
                        <option value="021">SF-07-0-021: เครื่องป้องกันหม้อแปลงตาข่าย</option>
                        <option value="022">SF-07-0-022: หม้อแปลงวงจรตาข่ายและสวิตช์แรงกลาง</option>
                        <option value="023">SF-07-0-023: ทดสอบและกรองน้ำมันหม้อแปลง</option>
                        <option value="024">SF-07-0-024: รายงานจุดร้อนแดง (Hot Spot)</option>
                        <option value="025">SF-07-0-025: รายงานตรวจสอบ Partial Discharge (Acoustic Camera)</option>
                    </select>
                    <button class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-4 py-2 rounded-lg transition shadow-xs whitespace-nowrap">บันทึกข้อมูล</button>
                </div>
            </div>
        </header>

        <!-- Main Form Container -->
        <main class="max-w-6xl mx-auto px-4 py-6">
            <div class="bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden">
                <!-- Form Header Bar -->
                <div id="formTitleBar" class="bg-slate-900 text-white px-6 py-4 font-semibold text-sm flex justify-between items-center">
                    <span>แบบตรวจสอบบำรุงรักษาหม้อแปลงจำหน่าย (SF-07-0-015)</span>
                    <span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full">สถานะ: พร้อมกรอกข้อมูล</span>
                </div>

                <!-- Form Content Area -->
                <div class="p-6 md:p-8" id="formContentArea">
                    <!-- Dynamic Render Content -->
                </div>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400 mt-12">
        พัฒนาเพื่อการปฏิบัติงานภาคสนาม • รองรับมาตรฐานฟอร์ม กฟภ. (PEA)
    </footer>

    <script>
        const formSelector = document.getElementById('formSelector');
        const formTitleBar = document.getElementById('formTitleBar').querySelector('span');
        const formContentArea = document.getElementById('formContentArea');

        const formTitles = {
            "015": "แบบตรวจสอบบำรุงรักษาหม้อแปลงจำหน่าย (SF-07-0-015)",
            "016": "แบบตรวจสอบบำรุงรักษา Load Break Switch (SF-07-0-016)",
            "017": "แบบตรวจสอบบำรุงรักษา Sectionalizer (SF-07-0-017)",
            "018": "แบบตรวจสอบบำรุงรักษา Ring Main Unit (RMU) (SF-07-0-018)",
            "019": "แบบตรวจสอบบำรุงรักษา Unit Substation (SF-07-0-019)",
            "020": "แบบตรวจสอบบำรุงรักษา Capacitor Bank 12-24 kV ในสายป้อน (SF-07-0-020)",
            "021": "แบบตรวจสอบบำรุงรักษาเครื่องป้องกันหม้อแปลงวงจรตาข่าย (SF-07-0-021)",
            "022": "แบบตรวจสอบบำรุงรักษาหม้อแปลงวงจรตาข่ายและสวิตช์แรงกลาง (SF-07-0-022)",
            "023": "แบบตรวจสอบบำรุงรักษาทดสอบและกรองน้ำมันหม้อแปลงวงจรตาข่าย (SF-07-0-023)",
            "024": "รายงานผลการตรวจสอบจุดร้อนแดง (Hot Spot) (SF-07-0-024)",
            "025": "รายงานผลการตรวจสอบการคายประจุไฟฟ้าบางส่วน (Partial Discharge) ด้วย Acoustic Camera (SF-07-0-025)"
        };

        formSelector.addEventListener('change', (e) => {
            const val = e.target.value;
            formTitleBar.innerText = formTitles[val];

            if (val === "025") {
                formContentArea.innerHTML = `
                    <div class="space-y-6 text-xs">
                        <div class="bg-indigo-50/50 border border-indigo-100 p-4 rounded-xl grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="block text-slate-600 font-medium mb-1">ผู้ตรวจคนที่ 1:</label><input type="text" class="border border-slate-300 rounded-lg px-3 py-2 w-xl bg-white focus:ring-2 focus:ring-indigo-500"></div>
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="block text-slate-600 font-medium mb-1">ตำแหน่ง:</label><input type="text" class="border border-slate-300 rounded-lg px-3 py-2 w-full bg-white"></div>
                                <div><label class="block text-slate-600 font-medium mb-1">วันที่ตรวจ:</label><input type="date" class="border border-slate-300 rounded-lg px-3 py-2 w-full bg-white"></div>
                            </div>
                            <div><label class="block text-slate-600 font-medium mb-1">ผู้ตรวจคนที่ 2:</label><input type="text" class="border border-slate-300 rounded-lg px-3 py-2 w-xl bg-white"></div>
                            <div><label class="block text-slate-600 font-medium mb-1">ตำแหน่ง:</label><input type="text" class="border border-slate-300 rounded-lg px-3 py-2 w-xl bg-white"></div>
                        </div>

                        <div>
                            <h3 class="text-sm font-bold text-slate-900 mb-3 flex items-center gap-2"><span class="w-2 h-2 bg-indigo-600 rounded-full"></span> 1. ข้อมูลภาพถ่ายและพิกัดอุปกรณ์</h3>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                <div><span class="text-slate-500 block mb-1">Station ID</span><input type="text" class="border border-slate-300 rounded-lg px-3 py-2 w-xl"></div>
                                <div><span class="text-slate-500 block mb-1">อุปกรณ์</span><input type="text" class="border border-slate-300 rounded-lg px-3 py-2 w-xl"></div>
                                <div><span class="text-slate-500 block mb-1">MEA No.</span><input type="text" class="border border-slate-300 rounded-lg px-3 py-2 w-xl"></div>
                                <div class="col-span-2"><span class="text-slate-500 block mb-1">สถานที่</span><input type="text" class="border border-slate-300 rounded-lg px-3 py-2 w-xl"></div>
                                <div><span class="text-slate-500 block mb-1">สายป้อน</span><input type="text" class="border border-slate-300 rounded-lg px-3 py-2 w-xl"></div>
                            </div>
                        </div>

                        <div class="border border-slate-200 p-4 rounded-xl space-y-4">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label class="block text-slate-600 font-medium mb-1">จุดที่ผิดปกติ</label><input type="text" class="border border-slate-300 rounded-lg px-3 py-2 w-xl"></div>
                                <div>
                                    <label class="block text-slate-600 font-medium mb-1">ระดับความเข้มเสียงที่ตรวจวัดได้ (dB)</label>
                                    <div class="flex items-center gap-2"><input type="text" class="border border-slate-300 rounded-lg px-3 py-2 w-36 font-bold text-center" placeholder="0.0"> <span class="text-slate-500 font-medium">dB</span></div>
                                </div>
                            </div>
                            <div>
                                <label class="block text-slate-600 font-medium mb-1">ระดับความรุนแรง (ประเมินจาก Software NL CLOUD)</label>
                                <div class="flex flex-wrap gap-6 mt-2">
                                    <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="severity" class="w-4 h-4 text-red-600 accent-red-600"> <span class="text-red-700 font-medium">สูงมาก</span></label>
                                    <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="severity" class="w-4 h-4 text-orange-600 accent-orange-500"> <span class="text-orange-700 font-medium">สูง</span></label>
                                    <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="severity" class="w-4 h-4 text-amber-600 accent-amber-500"> <span class="text-amber-700 font-medium">ปานกลาง</span></label>
                                    <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="severity" class="w-4 h-4 text-blue-600 accent-blue-500"> <span class="text-blue-700 font-medium">ต่ำ</span></label>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center text-slate-400 bg-slate-50 hover:bg-slate-100 transition cursor-pointer">
                                📷 คลิกเพื่อแนบภาพถ่ายจากกล้องปกติ
                            </div>
                            <div class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center text-slate-400 bg-slate-50 hover:bg-slate-100 transition cursor-pointer">
                                🔊 คลิกเพื่อแนบภาพถ่ายจาก Acoustic Camera
                            </div>
                        </div>
                    </div>
                `;
            } else {
                formContentArea.innerHTML = `
                    <div class="space-y-6 text-xs">
                        <div class="bg-indigo-50/50 border border-indigo-100 p-4 rounded-xl grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="block text-slate-600 font-medium mb-1">Station ID:</label><input type="text" class="border border-slate-300 rounded-lg px-3 py-2 w-xl bg-white"></div>
                            <div><label class="block text-slate-600 font-medium mb-1">สถานที่:</label><input type="text" class="border border-slate-300 rounded-lg px-3 py-2 w-xl bg-white"></div>
                        </div>
                        <div>
                            <h3 class="text-sm font-bold text-slate-900 mb-3 flex items-center gap-2"><span class="w-2 h-2 bg-indigo-600 rounded-full"></span> 2. รายการตรวจสอบและผลการปฏิบัติงาน</h3>
                            <div class="border border-slate-200 rounded-xl p-12 text-center text-slate-400 bg-slate-50">
                                ส่วนแสดงตารางตรวจสอบรายการสำหรับ <span class="font-semibold text-slate-700">${formTitles[val]}</span> พร้อมตัวเลือก ปกติ / ชำรุด / ไม่มี
                            </div>
                        </div>
                    </div>
                `;
            }
        });

        formSelector.dispatchEvent(new Event('change'));
    </script>
</body>
</html>
