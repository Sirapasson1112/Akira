        .a4-sheet {

        th, td { border: 1px solid #BEBEBE; padding: 3px 6px; font-size: 10px; color: #333333; }
        th { background-color: #EFEFEF; font-weight: 600; }
        input[type="text"], input[type="date"] { border: none; outline: none; background: transparent; width: 100%; font-family: 'Sarabun', sans-serif; font-size: 10px; color: #222222; }
        textarea { color: #222222; }
        .theme-accent { background-color: #BEBEBE; color: #222222; }

        .theme-border { border-color: #BEBEBE; }
        .theme-text-accent { color: #666666; }
        .accent-radio { accent-color: #777777; }

        @media print {
            body { background: white !important; }

                        const lon = position.coords.longitude.toFixed(6);
